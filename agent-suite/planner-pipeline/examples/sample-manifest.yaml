  - Mobile is the primary surface, not an afterthought
journeys:
  - id: J001
    name: First-time part search
    actor: Hobbyist buyer
    trigger: Buyer needs a replacement part
    entryPoint: Homepage search bar
    assumptions:
      - Buyer arrives from a search engine
    steps:
      - step: 1
        location: Homepage
        userThought: I need to find this part
        userAction: Types a query
        systemResponse: Shows live suggestions
        featureIds:
          - F001
      - step: 2
        location: Search results
        userThought: Is this the right one?
        userAction: Opens a result
        systemResponse: Shows part detail
        featureIds:
          - F001
    decisionPoints:
      - atStep: 1
        decision: Refine search or open first result
        options:
          - Refine
          - Open
        defaultPath: Open
    emotionalCurve:
      - atStep: 1
        emotion: uncertain
        designResponse: Instant suggestions reduce uncertainty
    confusionRisks:
      - Too many filters shown at once on first visit
    recoveryPaths:
      - failure: No results found
        recoverySteps:
          - Show broader suggestions
          - Offer to clear filters
        worstCase: Buyer leaves the site
    completionSignal: Buyer opens a part detail page
    returnPath: Back button returns to search results with filters intact
    retentionOpportunity: Offer to save this search
    instrumentation:
      - search_performed
      - search_result_opened
features:
  - id: F001
    parentId: null
    name: Search
    summary: Faceted search across the parts catalogue.
    purpose: Let buyers find a compatible part quickly.
    userValue: Fast, confident discovery of the right part.
    businessValue: Higher conversion from search to purchase.
    actors:
      - Buyer
    entryPoints:
      - Homepage search bar
      - Category page search
    prerequisites:
      - Parts catalogue indexed
    primaryFlow:
      - step: 1
        actor: Buyer
        action: Performs step 1 of the search flow
        systemResponse: System responds to step 1
        visibleOutcome: Visible result of step 1
      - step: 2
        actor: Buyer
        action: Performs step 2 of the search flow
        systemResponse: System responds to step 2
        visibleOutcome: Visible result of step 2
      - step: 3
        actor: Buyer
        action: Performs step 3 of the search flow
        systemResponse: System responds to step 3
        visibleOutcome: Visible result of step 3
    alternateFlows:
      - name: Zero-result recovery
        trigger: Search returns no matches
        steps:
          - step: 1
            actor: Buyer
            action: Performs step 1 of the search flow
            systemResponse: System responds to step 1
            visibleOutcome: Visible result of step 1
        outcome: User is offered broader suggestions
    states:
      - state: default
        description: Search bar at rest
        userSees: Empty search bar with placeholder
        userCanDo:
          - Type a query
        exitCondition: User types
      - state: loading
        description: Results loading
        userSees: Skeleton result rows
        userCanDo:
          - Cancel
        exitCondition: Results arrive
      - state: empty
        description: No results
        userSees: No matches message with suggestions
        userCanDo:
          - Clear filters
        exitCondition: User clears a filter
      - state: error
        description: Search failed
        userSees: Error message with retry
        userCanDo:
          - Retry
        exitCondition: Retry succeeds
      - state: success
        description: Results shown
        userSees: List of matching parts
        userCanDo:
          - Open a part
          - Refine filters
        exitCondition: User opens a part
      - state: offline
        description: No connectivity
        userSees: Offline banner with cached results
        userCanDo:
          - View cached results
        exitCondition: Connectivity restored
    dataRequirements:
      - entity: Part
        fields:
          - id
          - name
          - compatibility
        source: WordPress catalogue export
        freshness: hourly
    permissions:
      - actor: Buyer
        capability: Search parts
        deniedBehaviour: Not applicable, search is public
    analyticsEvents:
      - name: search_performed
        trigger: User submits a query
        properties:
          - queryLength
          - resultCount
    failureModes:
      - failure: Search index unavailable
        cause: Index service outage
        userVisibleBehaviour: Error state with retry
        recovery: Automatic retry with backoff
    recoveryBehaviour:
      - Automatic retry on transient failure
    mobileBehaviour:
      - Filters collapse into a bottom sheet on mobile
    accessibilityBehaviour:
      - Search results are announced via an ARIA live region
    privacyConsiderations:
      - Search queries are not linked to personal data
    dependencies: []
    acceptanceCriteria:
      - id: AC001
        criterion: Search returns results within 300ms for 5000+ parts
        measurement: p95 latency under load test
    testScenarios:
      - id: TS001
        name: Search returns matches
        given: A catalogue of 5000 parts
        when: A buyer searches a known part name
        then: The part appears in the top 3 results
        kind: integration
    openDecisions:
      - Should search history be persisted across sessions?
designSystem:
  visualConcept: "Industrial-premium: dense data with confident, generous imagery
    for previews."
  visualPrinciples:
    - Search results prioritise scanability over decoration
    - Part imagery is always the largest element on a card
    - Every interactive element has a visible focus state
  visualAntiPatterns:
    - Do not use decorative motion on result loading
    - Do not hide filters behind more than one tap on mobile
    - Do not use grey-on-grey text for secondary metadata
  layoutSystem:
    description: 12-column responsive grid with a fixed-width content column.
    contentMaxWidth: 1180px
    wideLayoutMaxWidth: 1440px
    gridColumns: 12
    mobileGutter: 16px
    tabletGutter: 24px
    desktopGutter: 32px
    breakpoints:
      - name: mobile
        minWidth: 0px
      - name: desktop
        minWidth: 1024px
  typographySystem:
    headingFont: Inter
    bodyFont: Inter
    monoFont: JetBrains Mono
    baseSizePx: 16
    scaleRatio: 1.25
    lineHeights:
      body: 1.5
      heading: 1.2
    weightRules:
      - Headings use weight 600
      - Body text uses weight 400
  spacingSystem:
    baseUnitPx: 4
    spacingScale:
      - 4
      - 8
      - 12
      - 16
      - 24
      - 32
      - 48
      - 64
    usageRules:
      - Card padding uses the 16px step
      - Section gaps use the 48px step
  colourRoles:
    - role: primary
      value: "#1D4ED8"
      usage: Primary actions
      contrastNotes: Meets 4.5:1 against white
    - role: surface
      value: "#FFFFFF"
      usage: Card backgrounds
      contrastNotes: Base surface
    - role: danger
      value: "#DC2626"
      usage: Error states
      contrastNotes: Meets 4.5:1 against white
    - role: text-secondary
      value: "#4B5563"
      usage: Metadata text
      contrastNotes: Meets 4.5:1 against white
  componentDensity: Comfortable density with 16px minimum touch targets on mobile.
  shapeLanguage:
    cornerRadii:
      - 4
      - 8
    borderRules:
      - 1px solid border on cards
    elevationRules:
      - Cards use a 1dp shadow on hover
  iconography:
    style: Outlined
    strokeWidth: 1.5px
    sizes:
      - 16
      - 20
      - 24
    library: Lucide
  motionSystem:
    personality: Quick and functional, never decorative.
    microInteractionDurationMs:
      - 120
      - 180
    panelTransitionDurationMs:
      - 220
      - 280
    easingRules:
      - Use ease-out for entrances
      - Use ease-in for exits
    forbiddenMotion:
      - No parallax scrolling
      - No bouncing loaders
  responsiveRules:
    - breakpoint: mobile
      rule: Filters collapse into a bottom sheet
    - breakpoint: desktop
      rule: Filters remain visible in a left sidebar
  darkModeRules:
    - "Surface colours invert to #111827 background"
  reducedMotionRules:
    - Disable panel transitions when prefers-reduced-motion is set
  loadingPresentation:
    - Use skeleton rows matching final result card shape
  emptyStatePersonality:
    - Empty states offer a concrete next action, never just an apology
  errorPresentation:
    - Errors always include a retry action and a support link
  screenshotReviewChecklist:
    - Text contrast meets 4.5:1 on all surfaces
    - Touch targets are at least 44px on mobile
    - Focus states are visible on every interactive element
    - Empty and error states are visually distinct from loading
    - Part imagery is not cropped awkwardly on any breakpoint
architecture:
  systemContext: A search-first parts catalogue integrated with an existing WordPress site.
  architecturalStyle: Modular monolith with a dedicated search index service.
  architecturalPrinciples:
    - Search must be independently scalable from the WordPress origin
    - All catalogue data flows through one ingestion pipeline
    - Every API is documented and owned by exactly one module
  modules:
    - id: M001
      name: Search Service
      responsibility: Serves faceted search queries
      boundaries: Owns the search index only
      dependsOn:
        - Catalogue Ingestion
      exposedInterfaces:
        - GET /search
  dataModels:
    - name: Part
      purpose: Represents a printable part in the catalogue
      fields:
        - name: id
          type: string
          required: true
          notes: Primary key
        - name: name
          type: string
          required: true
          notes: Display name
      relationships:
        - belongs to Category
      indexes:
        - name
        - compatibility
      retention: indefinite
  APIs:
    - id: API001
      method: GET
      path: /search
      purpose: Faceted search over parts
      requestShape: "{ q: string, filters: object }"
      responseShape: "{ results: Part[] }"
      errors:
        - 400 invalid filter
      authRequired: false
      owner: Search Service
  events:
    - name: part.indexed
      emittedWhen: A part is added or updated
      payloadShape: "{ partId: string }"
      consumers:
        - Search Service
  stateOwnership:
    - state: search index
      owner: Search Service
      rationale: Only the search service writes to the index
  backgroundJobs:
    - name: catalogue-sync
      trigger: hourly schedule
      behaviour: Pulls updated parts from WordPress and reindexes them
      failureHandling: Retries with exponential backoff, alerts after 3 failures
      schedule: hourly
  cachingStrategy:
    - data: Popular search results
      layer: Redis
      ttl: 5 minutes
      invalidation: On catalogue sync completion
  authentication:
    approach: None required for public search
    details:
      - Search is a public, unauthenticated endpoint
  authorization:
    approach: Role-based for admin catalogue management
    roles:
      - buyer
      - admin
    rules:
      - Only admins can trigger manual reindex
  validationStrategy:
    - All API input validated with schema validation at the edge
  errorHandlingStrategy:
    - All errors return a structured error code and message
  observability:
    logging:
      - Structured JSON logs per request
    metrics:
      - search_latency_ms
      - search_zero_result_rate
    alerts:
      - Alert when zero-result rate exceeds 20%
  securityControls:
    - threat: Search query injection into index backend
      control: Parameterized query builder, no raw query strings
      layer: Search Service
  deploymentModel:
    approach: Containerized services behind a load balancer
    environments:
      - staging
      - production
    steps:
      - Build image
      - Run migrations
      - Deploy
      - Smoke test
  migrationStrategy:
    approach: Expand-and-contract schema migrations
    steps:
      - Add new columns nullable
      - Backfill
      - Enforce constraints
  backupStrategy:
    approach: Nightly automated database snapshots
    cadence: nightly
    restoreTest: Monthly restore drill into a staging environment
  rollbackStrategy:
    approach: Blue-green deployment with instant traffic switch
    steps:
      - Route traffic back to previous version
      - Investigate failure
  testStrategy:
    levels:
      - unit
      - integration
      - e2e
    tooling:
      - Vitest
      - Testcontainers
    coverageExpectations: Critical search paths covered by integration tests
  performanceTargets:
    - metric: search p95 latency
      target: under 300ms
      measurement: Load test against 5000+ part catalogue
  scalabilityRisks:
    - Search index growth beyond single-node capacity
  architectureDecisions:
    - id: ADR001
      decision: Use a dedicated search index rather than direct WordPress queries
      rationale: WordPress database cannot serve faceted search at required latency
      alternativesConsidered:
        - Direct MySQL full-text search
      tradeoffs:
        - Adds an ingestion pipeline to operate
      failureModes:
        - Index falls out of sync with source data
      futureExtension: Index can later support shape-similarity search
    - id: ADR002
      decision: Public search API requires no authentication
      rationale: Search is a discovery surface intended for anonymous buyers
      alternativesConsidered:
        - Requiring account creation before search
      tradeoffs:
        - Cannot personalize anonymous search results
      failureModes:
        - Potential for scraping abuse
      futureExtension: Add optional personalization for logged-in users
    - id: ADR003
      decision: Cache popular search results in Redis
      rationale: Reduces repeated load on the search index for common queries
      alternativesConsidered:
        - No caching layer
      tradeoffs:
        - Cache invalidation adds operational complexity
      failureModes:
        - Stale cached results after a catalogue update
      futureExtension: Move to a CDN-edge cache for global buyers
