  systemicRisks:
    - Search reliability under catalogue growth beyond 5000 parts
  highestRiskAreas:
    - Zero-result recovery
    - Offline search behaviour
  missingRecoveryPatterns:
    - No offline cached-results fallback defined for repeat searches
  requiredPlanChanges:
    - section: features.F001.states
      problem: No offline recovery state defined for search.
      requiredChange: Add an offline state showing cached results with a stale-data indicator.
      responsibleStage: feature_expander
scope:
  classifications:
    - itemId: F001
      itemName: Search
      scopeClass: essential
      rationale: Core value proposition of the product.
      cheaperAlternative: null
      isSignatureElement: true
    - itemId: SF002
      itemName: 3D part preview
      scopeClass: delight
      rationale: Strong differentiator but not required for launch.
      cheaperAlternative: Static high-resolution photos
      isSignatureElement: true
  minimumCompleteProduct:
    - F001
  recommendedFirstRelease:
    - F001
    - SF003
  premiumRelease:
    - SF002
  experiments:
    - Shape-similarity search prototype
  deferredItems:
    - Build provenance graph
  rejectedItems: []
  sequencingRationale:
    - Search must ship before any premium preview feature since it is the core
      hook.
  scopeRisks:
    - 3D preview asset pipeline could slip the premium release date
implementationPlan:
  phases:
    - id: P1
      name: Foundation search
      goal: Ship faceted search over the full catalogue
      includedFeatureIds:
        - F001
      exitCriteria:
        - Search returns results within 300ms p95 for 5000+ parts
  workstreams:
    - id: W1
      name: Search platform
      description: Search indexing and query API
      phaseIds:
        - P1
  dependencyGraph:
    - from: Catalogue ingestion
      to: Search Service
      reason: Search indexes data produced by ingestion
  proposedRepositoryStructure:
    - path: apps/search-service
      kind: directory
      purpose: Search indexing and query API
  fileResponsibilities:
    - path: apps/search-service/src/index.ts
      responsibility: Search query handler
      relatedFeatureIds:
        - F001
  databaseChanges:
    - id: DB1
      change: Add parts table with search indexes
      phaseId: P1
      reversible: true
  apiBuildOrder:
    - GET /search
  uiBuildOrder:
    - Search bar
    - Search results list
  testBuildOrder:
    - Search API integration tests
    - Search UI accessibility tests
  releaseCheckpoints:
    - id: RC1
      name: Search MVP launch
      afterPhaseId: P1
      verification:
        - Load test passes at 5000+ parts
        - Accessibility checklist passes
qualityRequirements:
  performance:
    - Search p95 latency under 300ms
  accessibility:
    - Search results announced via ARIA live region
  security:
    - No raw query strings passed to the search backend
  reliability:
    - Search degrades to cached results on index outage
  compatibility:
    - Supports the latest two versions of major mobile browsers
definitionOfDone:
  - id: DOD1
    item: Search returns results within performance targets
    verification: Load test report
  - id: DOD2
    item: All UI states defined for search are implemented
    verification: Manual QA against state list
  - id: DOD3
    item: Accessibility checklist passes for search
    verification: Automated + manual accessibility audit
  - id: DOD4
    item: Offline recovery state is implemented
    verification: Manual QA with network throttling
  - id: DOD5
    item: Search API documented via OpenAPI
    verification: OpenAPI schema review
unresolvedDecisions:
  - id: UD1
    decision: Should search history persist across sessions?
    options:
      - Yes, persist per account
      - No, session-only
    recommendation: Session-only for the first release
    blockedBy: awaiting stakeholder input
assumptions:
  - id: A001
    statement: Parts data can be exported from the existing WordPress catalogue.
    basis: No alternative data source was mentioned in the brief.
    confidence: medium
    impactIfWrong: Would require a new data migration workstream.
