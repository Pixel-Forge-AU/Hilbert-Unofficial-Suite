project:
  title: Searchable 3D parts library
  brief: Build a searchable parts library for a 3D printing business.
  constraints:
    - Must integrate with WordPress
    - Must support more than 5000 parts
    - Must work well on mobile
  context:
    existingStack:
      - WordPress
      - PHP
      - JavaScript
    existingSystems: []
    referenceNotes: []
  preferences:
    strictness: 9
    creativity: 9
    detailLevel: 10
    targetQualityScore: 92
    maxRevisionCycles: 4
productDirection:
  selectedDirection: Reliable Catalogue with Premium Workshop preview polish
  directionRationale: Combines dependable faceted search with a premium 3D preview
    to build trust without the cost of full geometry search.
  experienceThesis: Finding the right part should feel as fast as it feels trustworthy.
  creativePrinciples:
    - Search must never return a dead end
    - Every part preview builds purchase confidence
    - Mobile is the primary surface, not an afterthought
  borrowedElements:
    - fromConceptId: C002
      element: 3D part preview
      whyItSurvives: Directly builds purchase confidence
  signatureFeatures:
    - id: SF001
      name: Faceted search
      whatMakesItMemorable: Never a dead end
      coreOrOptional: core_identity
    - id: SF002
      name: 3D part preview
      whatMakesItMemorable: Tangible before buying
      coreOrOptional: optional_novelty
    - id: SF003
      name: Saved searches
      whatMakesItMemorable: Fast return visits
      coreOrOptional: core_identity
  discardedIdeas:
    - idea: Shape-similarity search
      sourceConceptId: C004
      reasonDiscarded: Too costly for the first release
  designRisks:
    - 3D preview asset pipeline adds build time
  memorabilityTest:
    - Would a user describe this as 'the search that always finds something'?
    - Would a user remember the 3D preview specifically?
    - Would a returning user recall a saved search?
users:
