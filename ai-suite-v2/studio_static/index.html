<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Suite V2 Studio</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <aside class="rail">
      <div class="brand">
        <span class="mark"></span>
        <div>
          <strong>AI Suite V2 Studio</strong>
          <small>Legacy workflows from ai-suite-v2</small>
        </div>
      </div>
      <nav id="workflowNav">
        <button class="nav-item active" type="button">Loading</button>
      </nav>
      <section class="runtime-panel">
        <div class="runtime-panel-head">
          <strong>LLM Runtime</strong>
          <button id="refreshLlmEndpoints" type="button">Check</button>
        </div>
        <div id="llmEndpoints" class="runtime-list">
          <div class="runtime-empty">Checking endpoints.</div>
        </div>
      </section>
      <div class="status">
        <span id="comfyDot"></span>
        <div>
          <strong id="comfyState">Checking</strong>
          <small id="comfyUrl">ComfyUI</small>
        </div>
      </div>
    </aside>

    <main>
      <section class="workspace">
        <form id="generateForm" class="composer">
          <div class="topline">
            <div>
              <p id="modeLabel">Image</p>
              <h1 id="modeTitle">Generate a new image</h1>
            </div>
            <button type="submit" id="generateButton">Generate</button>
          </div>

          <div id="workflowFields"></div>

          <section id="sequencePanel" class="sequence-panel" hidden>
            <div class="sequence-head">
              <div>
                <h2>Sequence</h2>
              </div>
              <button type="button" id="generateSequenceButton">Generate Sequence</button>
            </div>
            <div class="sequence-controls">
              <label class="field">
                <span>Segments</span>
                <input id="sequenceCount" type="number" min="2" max="12" step="1" value="3" />
              </label>
              <label class="field check-field sequence-check">
                <span>Stitch when possible</span>
                <input id="sequenceStitch" type="checkbox" checked />
              </label>
            </div>
            <div id="sequenceList" class="sequence-list"></div>
          </section>

          <div id="modeNote" class="note"></div>
        </form>

        <section class="preview">
          <div class="preview-head">
            <div>
              <p>Latest output</p>
              <h2 id="latestTitle">Gallery</h2>
            </div>
            <button id="refreshGallery" type="button">Refresh</button>
          </div>
          <div id="latest" class="latest empty">No outputs found yet.</div>
        </section>
      </section>

      <section class="gallery-wrap">
        <div class="section-head">
          <h2>Output Gallery</h2>
          <div class="job-readout">
            <p id="jobStatus">Ready.</p>
            <div class="progress-track" aria-hidden="true"><div id="progressFill"></div></div>
            <div id="queuePanel" class="queue-panel empty">Queue is empty.</div>
          </div>
        </div>
        <div id="gallery" class="gallery"></div>
      </section>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/three.module.js"
        }
      }
    </script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
