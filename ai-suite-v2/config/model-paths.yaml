# Model Paths Configuration
# Define where models should be stored and found

model_paths:
  # Base directory for all models
  base_dir: "./models"
  
  # Model type directories
  checkpoints: "./models/checkpoints"
  vae: "./models/vae"
  lora: "./models/lora"
  controlnet: "./models/controlnet"
  upscale: "./models/upscale"
  embedding: "./models/embeddings"
  clip: "./models/clip"
  t5: "./models/t5"
  segmentation: "./models/segmentation"
  face_detection: "./models/face_detection"
  vision_encoder: "./models/vision_encoder"

# Model registry - auto-generated by build tools
model_registry: "./registry/models.json"

# Default model preferences (will be overridden by workflow requirements)
defaults:
  checkpoint: "flux/schnell/flux-schnell.safetensors"
  vae: "sdxl/vae/sdxl-vae.safetensors"
  clip: "sdxl/clip/clip_l.safetensors"
  t5: "flux/t5/t5xxl_fp16.safetensors"
  
# Download mirrors
mirrors:
  - "https://huggingface.co"
  - "https://civitai.com"
  
# Cache settings
cache:
  enabled: true
  max_size_gb: 100
  cleanup_unused: true