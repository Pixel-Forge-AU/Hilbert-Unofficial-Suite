# Detailed Preset for Character Full Body

name: Detailed
description: High-quality detailed full body character generation

generation:
  width: 512
  height: 768
  steps: 35
  cfg: 8.0
  batch_size: 1

sampling:
  sampler: dpmpp_2m
  scheduler: simple
  denoise: 1.0

quality:
  enable_upscale: true
  enable_face_restore: true
  enable_sharpen: true
  sharpen_amount: 0.3

runtime:
  low_vram: false
  cpu_offload: true
  enable_tiling: false
  enable_cpu_offload: true