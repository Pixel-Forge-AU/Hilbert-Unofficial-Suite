id: editing.background-removal
name: Background Removal
version: 2.0.0
category: image-editing
description: Background removal using the installed BiRefNet ComfyUI workflow. Upload
  an image and generate an alpha/transparent-background result.
status: stable
media_type: image
source:
  suite: v1
  path: legacy-workflows/remove-background-birefnet.json
entrypoints:
  ui: workflow.json
inputs:
- id: image
  label: Input image
  type: file
  required: true
  default: the_lily_veil.png
  legacy_kind: file
  node_id: '17'
  node_type: LoadImage
  input: image
  accept: image/png,image/jpeg,image/webp,image/bmp
  description: Image to remove background from
- id: 19_sg_14.bg_removal_name
  label: Background removal model
  type: text
  required: false
  default: birefnet.safetensors
  legacy_kind: text
  node_id: 19_sg_14
  node_type: LoadBackgroundRemovalModel
  input: bg_removal_name
  accept: image/png,image/jpeg,image/webp,image/bmp
  description: BiRefNet model file
- id: filename_prefix
  label: Output folder/prefix
  type: text
  required: false
  default: ai-suite/background-removal
  node_id: studio_save_background_removal
  node_type: SaveImage
  input: filename_prefix
  description: Output filename prefix
outputs:
- id: image
  type: image
  description: Image with background removed
models:
  required:
  - node_id: 19_sg_14
    node_type: LoadBackgroundRemovalModel
    name: birefnet.safetensors
    directory: background_removal
    url: https://huggingface.co/Comfy-Org/BiRefNet/resolve/main/background_removal/birefnet.safetensors
  optional: []
custom_nodes:
  required:
  - comfyui
  optional: []
hardware:
  minimum_vram_gb: 6
  recommended_vram_gb: 12
  supports_low_vram: true
  supports_cpu_offload: true
