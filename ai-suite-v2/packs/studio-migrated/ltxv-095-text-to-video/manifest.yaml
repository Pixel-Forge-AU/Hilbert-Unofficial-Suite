  path: legacy-workflows/ltxv-095-text-to-video.json
entrypoints:
  ui: workflow.json
inputs:
- id: 6.text
  label: Prompt
  type: textarea
  required: false
  default: A drone quickly rises through a bank of morning fog, revealing a pristine
    alpine lake surrounded by snow-capped mountains. The camera glides forward over
    the glassy water, capturing perfect reflections of the peaks. As it continues,
    the perspective shifts to reveal a lone wooden cabin with a curl of smoke from
    its chimney, nestled among tall pines at the lake's edge. The final shot tracks
    upward rapidly, transitioning from intimate to epic as the full mountain range
    comes into view, bathed in the golden light of sunrise breaking through scattered
    clouds.
  legacy_kind: textarea
  node_id: '6'
  node_type: CLIPTextEncode
  input: text
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 7.text
