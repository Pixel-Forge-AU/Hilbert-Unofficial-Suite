id: studio.extract-video-frame-blueprint
name: Extract video frame blueprint
version: 2.0.0
category: image-analysis
description: Migrated V1 Studio video workflow from extract-video-frame-blueprint.json
status: migrated
media_type: video
source:
  suite: v1
  path: legacy-workflows/extract-video-frame-blueprint.json
entrypoints:
  ui: workflow.json
inputs:
- id: 98_sg_3.length
  label: Frames
  type: int
  required: false
  default: 1
  legacy_kind: number
  node_id: 98_sg_3
  node_type: ImageFromBatch
  input: length
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: studio_load_video_98_sg_1_video.video
  label: Input video
  type: file
  required: false
  default: ''
  legacy_kind: file
  node_id: studio_load_video_98_sg_1_video
  node_type: LoadVideo
  input: video
  accept: video/mp4,video/webm,video/quicktime,video/x-matroska
- id: 98_sg_3.batch_index
  label: ImageFromBatch batch_index
  type: int
  required: false
  default: 0
  legacy_kind: number
  node_id: 98_sg_3
  node_type: ImageFromBatch
  input: batch_index
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 98_sg_99.expression
  label: ComfyMathExpression expression
  type: text
  required: false
  default: min(max(int(a if a >= 0 else b + a), 0), b - 1)
  legacy_kind: text
  node_id: 98_sg_99
  node_type: ComfyMathExpression
  input: expression
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 98_sg_100.value
  label: PrimitiveInt value
  type: int
  required: false
  default: 0
  legacy_kind: number
  node_id: 98_sg_100
  node_type: PrimitiveInt
  input: value
  accept: image/png,image/jpeg,image/webp,image/bmp
outputs:
- id: video
  type: video
  description: Generated video output
models:
  required: []
  optional: []
custom_nodes:
  required:
  - comfyui
  optional: []
hardware:
  minimum_vram_gb: 8
  recommended_vram_gb: 16
  supports_low_vram: true
  supports_cpu_offload: false
