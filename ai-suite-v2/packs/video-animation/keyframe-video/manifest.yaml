id: video.keyframe-video
name: Keyframe Video (Start + End)
version: 1.0.0
category: video-animation
description: >
  Animate smooth motion between a start image and an end image (WAN 2.2
  first-last-frame-to-video, 14B). Used by the storyboard feature to
  interpolate between consecutive shots rather than just varying camera
  motion on one static image.

  UNVERIFIED ON THIS HARDWARE: this loads two 14B-parameter experts
  (high-noise and low-noise) plus a text encoder. The similarly large
  Qwen-Image checkpoint (~20GB) previously OOM-killed ComfyUI on this
  machine (see core.text-to-image-hq's warning) - this pack has not yet
  been confirmed safe at that scale.
status: experimental
media_type: video
source:
  suite: v1
  path: packs/studio-migrated/start-end-image-to-video-wan-22/workflow.json
  promoted_from: studio.start-end-image-to-video-wan-22
entrypoints:
  ui: workflow.json
inputs:
- id: 90.text
  label: Prompt
  type: textarea
  required: false
  default: Smooth cinematic motion, coherent transformation, continuous camera movement.
  legacy_kind: textarea
  node_id: '90'
  node_type: CLIPTextEncode
  input: text
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 78.text
  label: Negative prompt
  type: textarea
  required: false
  default: oversaturated colors, overexposed, static image, blurry details, subtitles,
    text, watermark, painterly style, low contrast, gray cast, worst quality, low
    quality, JPEG artifacts, ugly, incomplete, deformed, disfigured, frozen motion
  legacy_kind: textarea
  node_id: '78'
  node_type: CLIPTextEncode
  input: text
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 80.image
  label: Start image
  type: file
  required: false
  default: video_wan2_2_14B_flf2v_start_image.png
  legacy_kind: file
  node_id: '80'
  node_type: LoadImage
  input: image
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 89.image
  label: End image
  type: file
  required: false
  default: video_wan2_2_14B_flf2v_end_image.png
  legacy_kind: file
  node_id: '89'
  node_type: LoadImage
  input: image
  accept: image/png,image/jpeg,image/webp,image/bmp
outputs:
- id: video
  type: video
  description: Generated video output
models:
  required:
  - node_id: '72'
    node_type: CLIPLoader
    name: umt5_xxl_fp8_e4m3fn_scaled.safetensors
    directory: text_encoders
    url: https://huggingface.co/Comfy-Org/Wan_2.1_ComfyUI_repackaged/resolve/main/split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors
  - node_id: '76'
    node_type: UNETLoader
    name: wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors
    directory: diffusion_models
    url: https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/diffusion_models/wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors
  - node_id: '77'
    node_type: UNETLoader
    name: wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors
    directory: diffusion_models
    url: https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/diffusion_models/wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors
  optional: []
custom_nodes:
  required:
  - comfyui
  optional: []
hardware:
  minimum_vram_gb: 24
  recommended_vram_gb: 40
  supports_low_vram: false
  supports_cpu_offload: false
