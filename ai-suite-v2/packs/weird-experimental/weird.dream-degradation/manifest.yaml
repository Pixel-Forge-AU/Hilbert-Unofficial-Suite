id: weird.dream-degradation
name: Dream Degradation
version: 2.0.0
category: weird-experimental
media_type: image
description: Dream-like image degradation using a real ComfyUI img2img graph. Softens,
  distorts, and fades the source image with surreal memory-like artifacts.
status: experimental
entrypoints:
  ui: workflow.json
inputs:
- id: image
  label: Source image
  type: file
  required: true
  default: example.png
  node_id: '8'
  node_type: LoadImage
  input: image
  accept: image/png,image/jpeg,image/webp,image/bmp
  description: Source image
- id: prompt
  label: Dream instruction
  type: textarea
  required: false
  default: dreamlike degraded memory, soft blur, hazy colors, surreal fading, analog
    noise feeling, ghostly details, atmospheric distortion
  node_id: '2'
  node_type: CLIPTextEncode
  input: text
  description: Edit instruction
- id: negative_prompt
  label: Negative prompt
  type: textarea
  required: false
  default: sharp clean commercial image, text, watermark, logo, harsh contrast, low
    quality artifacts
  node_id: '4'
  node_type: CLIPTextEncode
  input: text
  description: Things to avoid
- id: degradation_strength
  label: Degradation strength
  type: float
  required: false
  default: 0.58
  minimum: 0.05
  maximum: 1.0
  step: 0.01
  node_id: '5'
  node_type: KSampler
  input: denoise
  description: How strongly to alter the source image
- id: width
  label: Width
  type: int
  required: false
  default: 1024
  minimum: 256
  maximum: 2048
  step: 64
  node_id: '9'
  node_type: ImageScale
  input: width
- id: height
  label: Height
  type: int
  required: false
  default: 1024
  minimum: 256
  maximum: 2048
  step: 64
  node_id: '9'
  node_type: ImageScale
  input: height
- id: steps
  label: Steps
  type: int
  required: false
  default: 18
  minimum: 1
  maximum: 100
  step: 1
  node_id: '5'
  node_type: KSampler
  input: steps
- id: cfg
  label: CFG
  type: float
  required: false
  default: 5.0
  minimum: 1.0
  maximum: 20.0
  step: 0.5
  node_id: '5'
  node_type: KSampler
  input: cfg
- id: seed
  label: Seed
  type: int
  required: false
  default: -1
  minimum: -1
  maximum: 1152921504606846975
  node_id: '5'
  node_type: KSampler
  input: seed
- id: checkpoint
  label: Checkpoint
  type: model
  required: false
  default: juggernaut-xl-v9.safetensors
  description: Checkpoint model to use
- id: filename_prefix
  label: Output folder/prefix
  type: text
  required: false
  default: ai-suite/dream-degradation
  node_id: '7'
  node_type: SaveImage
  input: filename_prefix
outputs:
- id: image
  type: image
  description: Edited image output
models:
  required:
  - type: checkpoints
    name: juggernaut-xl-v9.safetensors
    url: ''
  optional: []
custom_nodes:
  required:
  - comfyui
  optional: []
hardware:
  minimum_vram_gb: 6
  recommended_vram_gb: 12
  supports_low_vram: true
  supports_cpu_offload: true
runtime:
  class: medium
  batch_supported: false
tags:
- dream
- degradation
- img2img
- surreal
