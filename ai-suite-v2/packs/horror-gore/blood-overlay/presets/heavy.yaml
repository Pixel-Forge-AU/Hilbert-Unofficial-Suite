# Heavy Blood Preset

name: Heavy Blood
description: Maximum blood effects for gore scenes

generation:
  width: 1024
  height: 1024
  steps: 25
  cfg: 7.0
  batch_size: 1

sampling:
  sampler: dpmpp_2m
  scheduler: simple
  denoise: 1.0

blood:
  amount: 0.9
  intensity: 1.0
  opacity: 1.0

quality:
  enable_upscale: false
  enable_face_restore: false
  enable_sharpen: false

runtime:
  low_vram: true
  cpu_offload: true
  enable_tiling: false
