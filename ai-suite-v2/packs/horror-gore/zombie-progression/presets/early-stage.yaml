# Early Stage Preset

name: Early Stage
description: Early infection symptoms, minimal visible signs

generation:
  width: 1024
  height: 1024
  steps: 20
  cfg: 6.0
  batch_size: 1

sampling:
  sampler: dpmpp_2m
  scheduler: simple
  denoise: 1.0

infection:
  stage: 2
  severity: 0.4
  speed: 1.0

quality:
  enable_upscale: false
  enable_face_restore: false
  enable_sharpen: false

runtime:
  low_vram: true
  cpu_offload: true
  enable_tiling: false
