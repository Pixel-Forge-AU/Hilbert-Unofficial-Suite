# Quality Preset for Text-to-Image Low VRAM

name: Quality
description: Better quality while maintaining low VRAM

generation:
  width: 768
  height: 768
  steps: 35
  cfg: 7.5
  batch_size: 1

sampling:
  sampler: euler
  scheduler: simple
  denoise: 1.0

quality:
  enable_upscale: true
  upscale_factor: 1.5
  enable_face_restore: true
  enable_sharpen: subtle

runtime:
  low_vram: true
  cpu_offload: true
  enable_tiling: true
  enable_cpu_offload: true
  tile_size: 512