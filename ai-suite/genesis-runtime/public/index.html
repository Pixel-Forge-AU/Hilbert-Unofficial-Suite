<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Genesis</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /*
   * Visual identity ported from the original monolith's observer.css (custom properties,
   * card/panel treatment, tab-button styling) — not the self-hosted Manrope font files or
   * the floating drawer-over-chat layout, since Genesis's shell has no chat surface to float
   * over. This is a persistent sidebar instead. Categories below (Plugins/Primary/Secrets/
   * System/Identity) are the ONLY things this file knows about — it has zero knowledge of
   * what any specific tab is; every actual dashboard is a plugin's own contribution.
   */
  :root {
    color-scheme: dark;
    --bg: #0b0f1a;
    --panel: rgba(255, 255, 255, 0.07);
    --panel-strong: rgba(255, 255, 255, 0.11);
    --ink: #e4eaf4;
    --muted: #6b7894;
    --accent: #c8a96a;
    --accent-soft: rgba(200, 169, 106, 0.2);
    --border: rgba(255, 255, 255, 0.11);
    --ok: #4fc97a;
    --warn: #e6b04a;
    --bad: #e8605e;
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.3);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(ellipse 65% 45% at 15% 5%, rgba(99, 82, 200, 0.22) 0%, transparent 100%),
      radial-gradient(ellipse 55% 40% at 88% 92%, rgba(59, 110, 200, 0.18) 0%, transparent 100%),
      radial-gradient(ellipse 40% 35% at 55% 50%, rgba(18, 24, 48, 0.5) 0%, transparent 100%),
      linear-gradient(160deg, #0c1220 0%, #07090f 100%);
    min-height: 100vh;
    font-family: "Manrope", "Segoe UI", system-ui, sans-serif;
  }
  h1, h2, h3 { margin: 0; }
  code { background: rgba(255, 255, 255, 0.08); padding: 0 0.2rem; border-radius: 3px; font-size: 0.85em; }
  a { color: var(--accent); }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    backdrop-filter: blur(20px) saturate(1.2);
    -webkit-backdrop-filter: blur(20px) saturate(1.2);
    border-radius: 12px;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    padding: 14px;
  }
  .metric-label { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 5px; }
  .metric-value { font-size: 0.95rem; font-weight: 600; line-height: 1.25; }
  .tone-ok { color: var(--ok); } .tone-warn { color: var(--warn); } .tone-bad { color: var(--bad); }
  .status-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
  .panel-subtle { color: var(--muted); font-size: 0.85rem; }
  .empty { color: var(--muted); font-style: italic; }

  #app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
  #sidebar {
    background: rgba(8, 12, 24, 0.6);
    border-right: 1px solid var(--border);
    padding: 16px 10px;
    display: flex; flex-direction: column; gap: 18px;
  }
  #sidebar h1 { font-size: 1.15rem; letter-spacing: 0.02em; padding: 0 8px; margin-bottom: 4px; }
  .nav-group-label { color: var(--muted); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; padding: 0 8px; margin-bottom: 4px; }
  .nav-group { display: flex; flex-direction: column; gap: 4px; }
  .nav-group:empty, .nav-group-label:has(+ .nav-group:empty) { display: none; }
  .nav-button {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: transparent; color: var(--ink); border: 1px solid transparent; border-radius: 10px;
    padding: 7px 8px; font: inherit; font-size: 0.85rem; font-weight: 500; cursor: pointer;
    transition: background 140ms, color 140ms, border-color 140ms;
  }
  .nav-button:hover { background: rgba(255, 255, 255, 0.06); }
  .nav-button[aria-current="true"] {
    background: linear-gradient(135deg, rgba(212, 179, 116, 0.92), rgba(176, 128, 48, 0.92));
    color: #1a0f00; border-color: rgba(212, 179, 116, 0.45);
    box-shadow: 0 4px 18px rgba(200, 169, 106, 0.35);
  }
  .nav-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.3rem; height: 1.3rem; border-radius: 5px; background: rgba(255, 255, 255, 0.08);
    font-size: 0.7rem; font-weight: 700; flex: none;
  }
  .nav-button[aria-current="true"] .nav-icon { background: rgba(0, 0, 0, 0.15); }
  .nav-sub { font-size: 0.72rem; opacity: 0.7; }

  #main { padding: 22px 28px; overflow-x: auto; }
  #main > section { display: none; }
  #main > section.active { display: block; }

  .toolbar { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.75rem; flex-wrap: wrap; }
  #plugin-search { flex: 1; min-width: 12rem; padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; background: rgba(255,255,255,0.05); color: var(--ink); }
  .chip-filter { display: flex; gap: 0.35rem; }
  .chip { border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--ink); border-radius: 999px; padding: 0.25rem 0.7rem; font-size: 0.8rem; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); color: #1a0f00; border-color: var(--accent); }

  .plugin-card { border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 1rem; margin-bottom: 0.6rem; background: rgba(255,255,255,0.03); }
  .plugin-card.attention { border-color: var(--warn); }
  .plugin-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; }
  .plugin-title { font-weight: 600; }
  .plugin-id { color: var(--muted); font-weight: 400; font-size: 0.85em; }
  .plugin-desc { color: var(--muted); font-size: 0.88rem; margin: 0.2rem 0 0.5rem; }

  .switch { position: relative; display: inline-block; width: 38px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: rgba(255,255,255,0.15); border-radius: 999px; cursor: pointer; transition: background 0.15s; }
  .slider::before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform 0.15s; }
  .switch input:checked + .slider { background: var(--ok); }
  .switch input:checked + .slider::before { transform: translateX(16px); }
  .switch input:disabled + .slider { opacity: 0.5; cursor: not-allowed; }

  .badge-row { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.3rem; }
  .badge { font-size: 0.75rem; padding: 0.12rem 0.5rem; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
  .badge.ok { background: rgba(79, 201, 122, 0.15); color: var(--ok); border-color: rgba(79, 201, 122, 0.3); }
  .badge.missing-required { background: rgba(232, 96, 94, 0.15); color: var(--bad); border-color: rgba(232, 96, 94, 0.3); }
  .badge.missing-optional { background: rgba(230, 176, 74, 0.15); color: var(--warn); border-color: rgba(230, 176, 74, 0.3); }
  .badge.provides { background: var(--accent-soft); color: var(--accent); border-color: rgba(200, 169, 106, 0.3); }

  .plugin-meta { font-size: 0.78rem; color: var(--muted); margin-top: 0.35rem; }
  .plugin-failure { font-size: 0.8rem; color: var(--bad); margin-top: 0.35rem; }

  .subtab-strip { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
  .subtab-strip button { border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--ink); border-radius: 8px; padding: 0.35rem 0.75rem; font-size: 0.85rem; cursor: pointer; }
  .subtab-strip button[aria-selected="true"] {
    background: linear-gradient(135deg, rgba(212, 179, 116, 0.92), rgba(176, 128, 48, 0.92));
    color: #1a0f00; border-color: transparent;
  }
  #tab-content { border: 1px solid var(--border); border-radius: 12px; padding: 1rem; min-height: 4rem; background: rgba(255,255,255,0.03); }
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <h1>Genesis</h1>
    <div class="nav-group" id="nav-core">
      <button class="nav-button" data-section="plugins" aria-current="true"><span class="nav-icon">P</span> Plugins</button>
    </div>

    <div class="nav-group-label">Primary</div>
    <div class="nav-group" id="nav-primary"></div>

    <div class="nav-group-label">Identity</div>
    <div class="nav-group" id="nav-identity"></div>

    <div class="nav-group-label">Secrets</div>
    <div class="nav-group" id="nav-secrets"></div>

    <div class="nav-group-label">System</div>
    <div class="nav-group" id="nav-system"></div>
  </nav>

  <main id="main">
    <section id="section-status" class="card" style="margin-bottom:18px;">
      <div class="status-strip" id="status"><div class="empty">Loading&hellip;</div></div>
    </section>

    <section id="section-plugins" class="active">
      <div class="panel-head"><h2>Plugins</h2></div>
      <div class="toolbar">
        <input id="plugin-search" type="search" placeholder="Search plugins by name, id, or capability&hellip;">
        <div class="chip-filter" role="group" aria-label="Filter plugins">
          <button class="chip" data-filter="all" aria-pressed="true">All</button>
          <button class="chip" data-filter="enabled" aria-pressed="false">Enabled</button>
          <button class="chip" data-filter="attention" aria-pressed="false">Needs attention</button>
        </div>
      </div>
      <div id="plugin-list"><p class="empty">Loading&hellip;</p></div>
    </section>

    <section id="section-tab">
      <div class="subtab-strip" id="tab-strip"></div>
      <div id="tab-content"><p class="empty">Select a tab from the sidebar.</p></div>
    </section>
  </main>
</div>

<script type="module">
import { mountObserverPluginTab, createObserverBrowserHost } from "/observer-compat/browser/plugin-host.js";

let headers = {};
let pluginsData = null;
let activeFilter = "all";
let searchTerm = "";

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

// A capability is "satisfied" if some OTHER currently-enabled plugin provides it.
function isCapabilitySatisfied(capabilityName, capabilityProviders, excludePluginId) {
  const providers = capabilityProviders[capabilityName] || [];
  return providers.some((entry) => entry.enabled && entry.pluginId !== excludePluginId);
}

// Plugins that would lose a required capability if `pluginId` were disabled right now.
function findDependents(pluginId, plugins, capabilityProviders) {
  const providedByThis = new Set(
    (plugins.find((p) => p.id === pluginId)?.capabilities) || []
  );
  const affected = [];
  for (const other of plugins) {
    if (other.id === pluginId || !other.enabled) continue;
    const required = other.manifest?.dependencies?.requiredCapabilities || [];
    for (const cap of required) {
      if (!providedByThis.has(cap)) continue;
      const otherEnabledProviders = (capabilityProviders[cap] || []).filter(
        (entry) => entry.enabled && entry.pluginId !== pluginId
      );
      if (otherEnabledProviders.length === 0) {
        affected.push({ pluginId: other.id, pluginName: other.name, capability: cap });
      }
    }
  }
  return affected;
}

function pluginNeedsAttention(plugin, capabilityProviders) {
  if (!plugin.enabled) return false;
  const required = plugin.manifest?.dependencies?.requiredCapabilities || [];
  return required.some((cap) => !isCapabilitySatisfied(cap, capabilityProviders, plugin.id))
    || (plugin.failureCount || 0) > 0;
}

function matchesSearch(plugin, term) {
  if (!term) return true;
  const haystack = [
    plugin.id, plugin.name, plugin.description,
    ...(plugin.capabilities || []),
    ...(plugin.manifest?.dependencies?.requiredCapabilities || []),
    ...(plugin.manifest?.dependencies?.optionalCapabilities || [])
  ].join(" ").toLowerCase();
  return haystack.includes(term);
}

async function toggle(pluginId, nextEnabled) {
  await fetch(`/api/plugins/${encodeURIComponent(pluginId)}/toggle`, {
    method: "POST",
    headers: { ...headers, "content-type": "application/json" },
    body: JSON.stringify({ enabled: nextEnabled })
  });
  await loadPlugins();
}

function onToggleClick(plugin, capabilityProviders, plugins) {
  const nextEnabled = !plugin.enabled;
  if (nextEnabled) {
    const unmet = (plugin.manifest?.dependencies?.requiredCapabilities || [])
      .filter((cap) => !isCapabilitySatisfied(cap, capabilityProviders, plugin.id));
    if (unmet.length) {
      const proceed = confirm(
        `${plugin.name} requires ${unmet.join(", ")}, which no enabled plugin currently provides.\n\n` +
        `It will likely fail at runtime until those are enabled too. Enable it anyway?`
      );
      if (!proceed) return;
    }
  } else {
    const dependents = findDependents(plugin.id, plugins, capabilityProviders);
    if (dependents.length) {
      const lines = dependents.map((d) => `- ${d.pluginName} (needs ${d.capability})`).join("\n");
      const proceed = confirm(
        `Disabling ${plugin.name} will break:\n${lines}\n\nDisable anyway?`
      );
      if (!proceed) return;
    }
  }
  toggle(plugin.id, nextEnabled);
}

function renderPluginCard(plugin, capabilityProviders, plugins) {
  const required = plugin.manifest?.dependencies?.requiredCapabilities || [];
  const optional = plugin.manifest?.dependencies?.optionalCapabilities || [];
  const provides = plugin.capabilities || [];
  const attention = pluginNeedsAttention(plugin, capabilityProviders);

  const depBadges = [
    ...required.map((cap) => {
      const ok = isCapabilitySatisfied(cap, capabilityProviders, plugin.id);
      return `<span class="badge ${ok ? "ok" : "missing-required"}" title="${ok ? "satisfied" : "required, not currently provided by any enabled plugin"}">requires ${escapeHtml(cap)}${ok ? "" : " (missing)"}</span>`;
    }),
    ...optional.map((cap) => {
      const ok = isCapabilitySatisfied(cap, capabilityProviders, plugin.id);
      return `<span class="badge ${ok ? "ok" : "missing-optional"}" title="${ok ? "satisfied" : "optional, degraded functionality without it"}">optional ${escapeHtml(cap)}${ok ? "" : " (missing)"}</span>`;
    }),
    ...provides.map((cap) => `<span class="badge provides" title="provided by this plugin">provides ${escapeHtml(cap)}</span>`)
  ].join("");

  const failureNote = plugin.failureCount
    ? `<div class="plugin-failure">${plugin.failureCount} recorded failure${plugin.failureCount === 1 ? "" : "s"} &mdash; see /api/plugins/list</div>`
    : "";

  return `
    <div class="plugin-card${attention ? " attention" : ""}" data-plugin-id="${escapeHtml(plugin.id)}">
      <div class="plugin-head">
        <div>
          <div class="plugin-title">${escapeHtml(plugin.name)} <span class="plugin-id">${escapeHtml(plugin.id)} &middot; v${escapeHtml(plugin.version)}</span></div>
          <div class="plugin-desc">${escapeHtml(plugin.description || "")}</div>
        </div>
        <label class="switch" title="${plugin.enabled ? "Disable" : "Enable"} ${escapeHtml(plugin.name)}">
          <input type="checkbox" ${plugin.enabled ? "checked" : ""} data-toggle="${escapeHtml(plugin.id)}">
          <span class="slider"></span>
        </label>
      </div>
      ${depBadges ? `<div class="badge-row">${depBadges}</div>` : ""}
      ${failureNote}
      <div class="plugin-meta">${plugin.toolCount || 0} tools &middot; ${plugin.hookCount || 0} hooks &middot; ${plugin.routeCount || 0} routes</div>
    </div>`;
}

function renderPlugins() {
  const container = document.getElementById("plugin-list");
  if (!pluginsData || !pluginsData.plugins?.length) {
    container.innerHTML = `<p class="empty">No plugins installed &mdash; this is a zero-plugin Genesis instance.</p>`;
    return;
  }
  const { plugins, capabilityProviders } = pluginsData;
  const term = searchTerm.trim().toLowerCase();
  const visible = plugins
    .filter((p) => matchesSearch(p, term))
    .filter((p) => {
      if (activeFilter === "enabled") return p.enabled;
      if (activeFilter === "attention") return pluginNeedsAttention(p, capabilityProviders);
      return true;
    })
    .sort((a, b) => a.name.localeCompare(b.name));

  if (!visible.length) {
    container.innerHTML = `<p class="empty">No plugins match this filter.</p>`;
    return;
  }
  container.innerHTML = visible.map((p) => renderPluginCard(p, capabilityProviders, plugins)).join("");
  container.querySelectorAll("[data-toggle]").forEach((input) => {
    input.addEventListener("change", () => {
      const pluginId = input.getAttribute("data-toggle");
      const plugin = plugins.find((p) => p.id === pluginId);
      input.checked = plugin.enabled; // revert optimistic native toggle; onToggleClick drives the real state
      onToggleClick(plugin, capabilityProviders, plugins);
    });
  });
}

async function loadPlugins() {
  const pluginsRes = await fetch("/api/plugins/list", { headers });
  pluginsData = await pluginsRes.json();
  renderPlugins();
  renderNav();
}

// --- Sidebar navigation: purely generic category rendering ------------------------
//
// This section has NO knowledge of what any specific tab is. It only knows about the
// five categories the core computes (uiTabs+uiPrimaryTabs merged as "Primary",
// uiIdentityTabs, uiSecretsTabs, uiSystemTabs) plus its own built-in Plugins view. Every
// actual dashboard (Queue, Brains, Capabilities, anything else) is a plugin registering
// into one of these — this file must stay this way; do not special-case a tab by name here.

const NAV_GROUPS = [
  { key: "primary", navId: "nav-primary", fields: ["uiTabs", "uiPrimaryTabs"] },
  { key: "identity", navId: "nav-identity", fields: ["uiIdentityTabs"] },
  { key: "secrets", navId: "nav-secrets", fields: ["uiSecretsTabs"] },
  { key: "system", navId: "nav-system", fields: ["uiSystemTabs"] }
];

let tabsByKey = new Map();
let activeSection = "plugins";
let activeTabKey = null;
let host = null;

function authFetch(path, options = {}) {
  return fetch(path, { ...options, headers: { ...headers, ...(options.headers || {}) } });
}

function buildHost() {
  return createObserverBrowserHost({
    fetch: authFetch,
    adminFetch: authFetch,
    pluginAdminFetch: authFetch,
    refreshAll: loadPlugins
  });
}

function collectGroupTabs(data, fields) {
  const seen = new Set();
  const tabs = [];
  for (const field of fields) {
    for (const tab of data[field] || []) {
      if (!tab.enabled) continue;
      const key = `${tab.pluginId}:${tab.id}`;
      if (seen.has(key)) continue;
      seen.add(key);
      tabs.push({ ...tab, key });
    }
  }
  tabs.sort((a, b) => (a.order ?? 100) - (b.order ?? 100) || a.title.localeCompare(b.title));
  return tabs;
}

function showSection(sectionId) {
  activeSection = sectionId;
  document.querySelectorAll("#main > section").forEach((el) => el.classList.remove("active"));
  document.getElementById(`section-${sectionId === "plugins" ? "plugins" : "tab"}`)?.classList.add("active");
  document.querySelectorAll(".nav-button").forEach((btn) => {
    btn.setAttribute("aria-current", String(btn.dataset.section === sectionId || btn.dataset.tabKey === activeTabKey));
  });
}

function renderNav() {
  tabsByKey = new Map();
  document.getElementById("nav-core").querySelector('[data-section="plugins"]').onclick = () => {
    activeTabKey = null;
    showSection("plugins");
  };

  for (const group of NAV_GROUPS) {
    const tabs = collectGroupTabs(pluginsData || {}, group.fields);
    const navEl = document.getElementById(group.navId);
    navEl.innerHTML = tabs.map((tab) => {
      const label = `${tab.icon ? tab.icon + " " : ""}${tab.title}`;
      return `<button class="nav-button" data-tab-key="${escapeHtml(tab.key)}" title="${escapeHtml(tab.pluginName)}">
        <span class="nav-icon">${escapeHtml((tab.icon || tab.title[0] || "?").slice(0, 2))}</span>
        <span>${escapeHtml(label)}</span>
      </button>`;
    }).join("");
    navEl.querySelectorAll("[data-tab-key]").forEach((btn) => {
      const key = btn.getAttribute("data-tab-key");
      const tab = tabs.find((t) => t.key === key);
      tabsByKey.set(key, tab);
      btn.addEventListener("click", () => {
        activeTabKey = key;
        showSection("tab");
        mountActiveTab();
      });
    });
  }

  if (activeTabKey && !tabsByKey.has(activeTabKey)) {
    activeTabKey = null;
    showSection("plugins");
  }
  document.querySelectorAll(".nav-button").forEach((btn) => {
    btn.setAttribute("aria-current", String(
      (btn.dataset.section && btn.dataset.section === activeSection && !activeTabKey)
      || btn.dataset.tabKey === activeTabKey
    ));
  });
}

let mountToken = 0;
async function mountActiveTab() {
  const tab = tabsByKey.get(activeTabKey);
  const contentEl = document.getElementById("tab-content");
  const stripEl = document.getElementById("tab-strip");
  stripEl.innerHTML = "";
  if (!tab) {
    contentEl.innerHTML = `<p class="empty">Select a tab from the sidebar.</p>`;
    return;
  }
  const token = ++mountToken;
  contentEl.innerHTML = `<p class="empty">Loading&hellip;</p>`;
  try {
    const moduleExports = await import(tab.scriptUrl);
    if (token !== mountToken) return; // a newer tab was selected while this was loading
    contentEl.innerHTML = "";
    if (!host) host = buildHost();
    await mountObserverPluginTab(moduleExports, { root: contentEl, tab, host });
  } catch (err) {
    if (token !== mountToken) return;
    contentEl.innerHTML = `<p class="plugin-failure">Failed to load tab: ${escapeHtml(String(err?.message || err))}</p>`;
  }
}

async function main() {
  const tokenRes = await fetch("/api/admin-token");
  const tokenJson = await tokenRes.json();
  headers = tokenJson.ok ? { "x-admin-token": tokenJson.token } : {};

  const statusRes = await fetch("/api/runtime/status", { headers });
  const status = await statusRes.json();
  const statusEl = document.getElementById("status");
  statusEl.innerHTML = `
    <div><div class="metric-label">Core version</div><div class="metric-value">${escapeHtml(status.coreVersion)}</div></div>
    <div><div class="metric-label">Node version</div><div class="metric-value">${escapeHtml(status.nodeVersion)}</div></div>
    <div><div class="metric-label">Uptime</div><div class="metric-value">${Math.round(status.uptimeMs / 1000)}s</div></div>
    <div><div class="metric-label">Profile</div><div class="metric-value">${escapeHtml(status.profile?.name)} <span class="panel-subtle">(${escapeHtml(status.profile?.id)})</span></div></div>
    <div><div class="metric-label">Plugin load errors</div><div class="metric-value ${status.pluginLoadErrors?.length ? 'tone-warn' : 'tone-ok'}">${status.pluginLoadErrors?.length || 0}</div></div>
  `;

  document.getElementById("plugin-search").addEventListener("input", (event) => {
    searchTerm = event.target.value;
    renderPlugins();
  });
  document.querySelectorAll(".chip-filter .chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      activeFilter = chip.getAttribute("data-filter");
      document.querySelectorAll(".chip-filter .chip").forEach((c) => c.setAttribute("aria-pressed", String(c === chip)));
      renderPlugins();
    });
  });

  await loadPlugins();
}
main().catch((err) => {
  document.getElementById("status").innerHTML = `<div class="tone-bad">${err}</div>`;
});
</script>
</body>
</html>
