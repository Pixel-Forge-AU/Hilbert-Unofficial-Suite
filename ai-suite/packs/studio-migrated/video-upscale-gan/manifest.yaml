id: studio.video-upscale-gan
name: Video upscale gan
version: 2.0.0
category: video-animation
description: Migrated video workflow from video-upscale-gan.json
status: migrated
media_type: video
source:
  suite: v1
  path: /home/hilbert/ai-suite/legacy-workflows/video-upscale-gan.json
entrypoints:
  ui: workflow.json
inputs:
- id: 11.fps
  label: FPS
  type: int
  required: false
  default: 30
  legacy_kind: number
  node_id: '11'
  node_type: CreateVideo
  input: fps
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 9.video
  label: Input video
  type: file
  required: false
  default: gan_input.mp4
  legacy_kind: file
  node_id: '9'
  node_type: LoadVideo
  input: video
  accept: video/mp4,video/webm,video/quicktime,video/x-matroska
outputs:
- id: video
  type: video
  description: Generated video output
models:
  required:
  - node_id: '1'
    node_type: UpscaleModelLoader
    name: RealESRGAN_x4plus.safetensors
    directory: upscale_models
    url: https://huggingface.co/Comfy-Org/Real-ESRGAN_repackaged/resolve/main/RealESRGAN_x4plus.safetensors
  optional: []
custom_nodes:
  required:
  - comfyui
  optional: []
hardware:
  minimum_vram_gb: 8
  recommended_vram_gb: 16
  supports_low_vram: true
  supports_cpu_offload: false
