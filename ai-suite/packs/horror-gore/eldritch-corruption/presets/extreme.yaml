# Extreme Corruption Preset

name: Extreme Corruption
description: Maximum eldritch corruption for sanity-bending effects

generation:
  width: 1024
  height: 1024
  steps: 30
  cfg: 7.5
  batch_size: 1

sampling:
  sampler: dpmpp_2m
  scheduler: simple
  denoise: 1.0

mutation:
  strength: 1.0
  chaos_factor: 1.0
  features: 8

quality:
  enable_upscale: false
  enable_face_restore: false
  enable_sharpen: false

runtime:
  low_vram: false
  cpu_offload: false
  enable_tiling: false
