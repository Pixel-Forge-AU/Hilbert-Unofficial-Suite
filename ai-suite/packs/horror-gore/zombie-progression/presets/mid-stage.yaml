# Mid Stage Preset

name: Mid Stage
description: Clear infection signs, visible symptoms

generation:
  width: 1024
  height: 1024
  steps: 25
  cfg: 7.0
  batch_size: 1

sampling:
  sampler: dpmpp_2m
  scheduler: simple
  denoise: 1.0

infection:
  stage: 3
  severity: 0.7
  speed: 1.0

quality:
  enable_upscale: false
  enable_face_restore: false
  enable_sharpen: false

runtime:
  low_vram: false
  cpu_offload: true
  enable_tiling: false
