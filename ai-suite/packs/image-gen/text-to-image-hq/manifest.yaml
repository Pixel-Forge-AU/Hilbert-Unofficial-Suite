id: core.text-to-image-hq
name: Text to Image (HQ, high RAM)
version: 1.0.0
category: image-gen
description: >
  Higher-fidelity text-to-image generation using the non-distilled Qwen-Image checkpoint (~20B params). Unlike core.text-to-image (a step/cfg-distilled "turbo" model), this is a full diffusion model: steps and cfg are real quality levers here, not just speed knobs.
status: experimental
media_type: image
source:
  suite: v1
  path: legacy-workflows/qwen-image-text-to-image.json
entrypoints:
  ui: workflow.json
inputs:
- id: 67.text
  label: Prompt
  type: textarea
  required: false
  default: A breathtaking cinematic landscape at golden hour, dramatic clouds, rich detail, painterly light, high fidelity, evocative atmosphere
  legacy_kind: textarea
  node_id: '67'
  node_type: CLIPTextEncode
  input: text
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 71.text
  label: Negative prompt
  type: textarea
  required: false
  default: low quality, bad anatomy, extra digits, missing digits, extra limbs, missing limbs, blurry, watermark, text
  legacy_kind: textarea
  node_id: '71'
  node_type: CLIPTextEncode
  input: text
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 68.width
  label: Width
  type: int
  required: false
  default: 1328
  legacy_kind: number
  node_id: '68'
  node_type: EmptySD3LatentImage
  input: width
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 68.height
  label: Height
  type: int
  required: false
  default: 1328
  legacy_kind: number
  node_id: '68'
  node_type: EmptySD3LatentImage
  input: height
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 70.steps
  label: Steps
  type: int
  required: false
  default: 20
  legacy_kind: number
  node_id: '70'
  node_type: KSampler
  input: steps
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 70.cfg
  label: CFG
  type: int
  required: false
  default: 4
  legacy_kind: number
  node_id: '70'
  node_type: KSampler
  input: cfg
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 68.batch_size
  label: Batch
  type: int
  required: false
  default: 1
  legacy_kind: number
  node_id: '68'
  node_type: EmptySD3LatentImage
  input: batch_size
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: seed
  label: Seed
  type: int
  required: false
  default: 42
  legacy_kind: number
  node_id: '70'
  node_type: KSampler
  input: seed
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 9.filename_prefix
  label: Output folder/prefix
  type: text
  required: false
  default: ComfyUI
  legacy_kind: text
  node_id: '9'
  node_type: SaveImage
  input: filename_prefix
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 69.shift
  label: ModelSamplingAuraFlow shift
  type: number
  required: false
  default: 3.1
  legacy_kind: number
  node_id: '69'
  node_type: ModelSamplingAuraFlow
  input: shift
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 70.denoise
  label: Denoise
  type: int
  required: false
  default: 1
  legacy_kind: number
  node_id: '70'
  node_type: KSampler
  input: denoise
  accept: image/png,image/jpeg,image/webp,image/bmp
outputs:
- id: image
  type: image
  description: Generated image output
models:
  required:
  - node_id: '62'
    node_type: CLIPLoader
    name: qwen_2.5_vl_7b_fp8_scaled.safetensors
    directory: text_encoders
    url: https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/text_encoders/qwen_2.5_vl_7b_fp8_scaled.safetensors
  - node_id: '63'
    node_type: VAELoader
    name: qwen_image_vae.safetensors
    directory: vae
    url: https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/vae/qwen_image_vae.safetensors
  - node_id: '66'
    node_type: UNETLoader
    name: qwen_image_fp8_e4m3fn.safetensors
    directory: diffusion_models
    url: https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/diffusion_models/qwen_image_fp8_e4m3fn.safetensors
  optional: []
custom_nodes:
  required:
  - comfyui
  optional: []
hardware:
  minimum_vram_gb: 24
  recommended_vram_gb: 32
  supports_low_vram: false
  supports_cpu_offload: false
