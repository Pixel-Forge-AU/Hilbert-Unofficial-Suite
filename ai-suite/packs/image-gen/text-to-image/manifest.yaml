id: core.text-to-image
name: Text to Image
version: 2.0.0
category: image-gen
description: Fast text-to-image generation using the migrated Z-Image Turbo workflow.
status: stable
media_type: image
source:
  suite: v1
  path: packs/studio-migrated/z-image-turbo-fixed-ae-vae/workflow.json
  promoted_from: studio.z-image-turbo-fixed-ae-vae
entrypoints:
  ui: workflow.json
inputs:
- id: 67.text
  label: Prompt
  type: textarea
  required: false
  default: anime RPG game style, cute anime girl with gigantic fennec ears and a big
    fluffy fox tail with long wavy blonde hair and large blue eyes blonde colored
    eyelashes wearing a pink sweater a large oversized gold trimmed black winter coat
    and a long blue maxi skirt and a red scarf, she is sitting beside a campfire in
    the wilderness at night playing guitar with a milky way galaxy sky
  legacy_kind: textarea
  node_id: '67'
  node_type: CLIPTextEncode
  input: text
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 71.text
  label: Negative prompt
  type: textarea
  required: false
  default: low quality, bad anatomy, extra digits, missing digits, extra limbs, missing
    limbs
  legacy_kind: textarea
  node_id: '71'
  node_type: CLIPTextEncode
  input: text
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 68.width
  label: Width
  type: int
  required: false
  default: 1024
  legacy_kind: number
  node_id: '68'
  node_type: EmptySD3LatentImage
  input: width
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 68.height
  label: Height
  type: int
  required: false
  default: 1024
  legacy_kind: number
  node_id: '68'
  node_type: EmptySD3LatentImage
  input: height
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 70.steps
  label: Steps
  type: int
  required: false
  default: 8
  legacy_kind: number
  node_id: '70'
  node_type: KSampler
  input: steps
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 70.cfg
  label: CFG
  type: int
  required: false
  default: 1
  legacy_kind: number
  node_id: '70'
  node_type: KSampler
  input: cfg
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 68.batch_size
  label: Batch
  type: int
  required: false
  default: 1
  legacy_kind: number
  node_id: '68'
  node_type: EmptySD3LatentImage
  input: batch_size
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: seed
  label: Seed
  type: int
  required: false
  default: 42
  legacy_kind: number
  node_id: '70'
  node_type: KSampler
  input: seed
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 9.filename_prefix
  label: Output folder/prefix
  type: text
  required: false
  default: ComfyUI
  legacy_kind: text
  node_id: '9'
  node_type: SaveImage
  input: filename_prefix
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 69.shift
  label: ModelSamplingAuraFlow shift
  type: int
  required: false
  default: 3
  legacy_kind: number
  node_id: '69'
  node_type: ModelSamplingAuraFlow
  input: shift
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 70.denoise
  label: Denoise
  type: int
  required: false
  default: 1
  legacy_kind: number
  node_id: '70'
  node_type: KSampler
  input: denoise
  accept: image/png,image/jpeg,image/webp,image/bmp
outputs:
- id: image
  type: image
  description: Generated image output
models:
  required:
  - node_id: '62'
    node_type: CLIPLoader
    name: qwen_3_4b.safetensors
    directory: text_encoders
    url: https://huggingface.co/Comfy-Org/z_image_turbo/resolve/main/split_files/text_encoders/qwen_3_4b.safetensors
  - node_id: '63'
    node_type: VAELoader
    name: ae.safetensors
    directory: vae
    url: https://huggingface.co/Comfy-Org/z_image_turbo/resolve/main/split_files/vae/ae.safetensors
  - node_id: '66'
    node_type: UNETLoader
    name: z_image_turbo_bf16.safetensors
    directory: diffusion_models
    url: https://huggingface.co/Comfy-Org/z_image_turbo/resolve/main/split_files/diffusion_models/z_image_turbo_bf16.safetensors
  optional: []
custom_nodes:
  required:
  - comfyui
  optional: []
hardware:
  minimum_vram_gb: 8
  recommended_vram_gb: 16
  supports_low_vram: true
  supports_cpu_offload: false
