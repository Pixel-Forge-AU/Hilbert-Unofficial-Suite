# Text-to-Image Fast Workflow Manifest

id: core.text-to-image-fast
name: Text to Image Fast
version: "1.0.0"

category: image-gen
subcategory: text-to-image

description: >
  Fast text-to-image generation with 12 steps for quick drafts, thumbnails, and concept art.
  Optimized for speed while maintaining acceptable quality for rapid iteration.

status: stable

entrypoints:
  ui: workflow.json
  api: workflow-api.json

inputs:
  - id: prompt
    type: text
    required: true
    description: Positive prompt describing the desired image
    
  - id: negative_prompt
    type: text
    required: false
    default: ""
    description: Negative prompt for undesirable elements
    
  - id: width
    type: int
    required: false
    default: 1024
    minimum: 256
    maximum: 2048
    step: 64
    description: Output image width in pixels
    
  - id: height
    type: int
    required: false
    default: 1024
    minimum: 256
    maximum: 2048
    step: 64
    description: Output image height in pixels
    
  - id: seed
    type: int
    required: false
    default: -1
    minimum: -1
    maximum: 1152921504606846975
    description: Random seed for reproducibility (-1 for random)
    
  - id: cfg
    type: float
    required: false
    default: 2.0
    minimum: 1.0
    maximum: 20.0
    step: 0.5
    description: Classifier-free guidance scale
    
  - id: checkpoint
    type: model
    required: false
    default: "juggernaut-xl-v9.safetensors"
    description: Checkpoint model to use

outputs:
  - id: image
    type: image
    description: Generated image output

models:
  required:
    - role: checkpoint
      family:
        - flux
        - sdxl
        - sd15
        - sd3
        - sdxl-lightning
    - role: vae
      suggested:
        - ae
        - vae-ft-mse-840000-ema-pruned
    - role: text_encoder
      suggested:
        - t5xxl
        - clip-l

  optional:
    - role: lora
      suggested: []

custom_nodes:
  required:
    - comfyui

  optional:
    - comfyui-impact-pack
    - comfyui-controlnet-aux

hardware:
  minimum_vram_gb: 4
  recommended_vram_gb: 8
  supports_low_vram: true
  supports_cpu_offload: true

runtime:
  class: light
  batch_supported: true

content:
  themes:
    - general
    - drafting
    - thumbnailing
    - quick-iterations
  adult_only: false

tags:
  - fast
  - quick
  - draft
  - thumbnail
  - rapid-iteration
  - 12-steps
  - low-resource

presets:
  - fast
  - balanced
  - quality
