# Subtle Preset for AI Telephone

name: Subtle
description: Conservative transformation with minimal distortion

generations:
  count: 2
  steps: 12
  cfg: 2.0

transformation:
  prompt_modifier: "interpret this in a creative and artistic way"
  preserve_concept: true
  gradual_change: true

sampling:
  sampler: euler
  scheduler: simple
  denoise: 1.0

quality:
  enable_upscale: false
  enable_face_restore: false
  enable_sharpen: false

runtime:
  low_vram: true
  cpu_offload: true
  enable_tiling: false