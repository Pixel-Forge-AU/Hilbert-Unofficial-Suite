# Extreme Preset for Dream Degradation

name: Extreme
description: Heavy degradation with maximum transformation

degradation:
  strength: 0.85
  iterations: 8
  blur_radius: 10
  blur_sigma: 5.0
  noise_intensity: 0.4
  color_shift: 0.6

color:
  hue_shift: 0.25
  saturation: 0.7
  brightness: 0.9

quality:
  preserve_details: false
  enable_upscale: true
  enable_face_restore: true
  enable_sharpen: true

runtime:
  low_vram: false
  cpu_offload: true
  enable_tiling: true