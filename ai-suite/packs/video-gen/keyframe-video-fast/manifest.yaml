id: video.keyframe-video-fast
name: Keyframe Video Fast (Start + End, 4-step LoRA)
version: 1.0.0
category: video-gen
description: >
  Same as video.keyframe-video (WAN 2.2 first-last-frame-to-video) but using
  the 4-step Lightning LoRA variant instead of the full ~20-step sampler.
  Verified on this hardware: memory-safe (peaks ~19GB then drops back down,
  same as the full version) and roughly 5x fewer sampling steps, so
  substantially faster - useful for storyboards with several transitions
  where the full version's per-segment time adds up fast.
status: experimental
media_type: video
source:
  suite: v1
  path: packs/studio-migrated/start-end-image-to-video-wan-22/workflow.json
  promoted_from: studio.start-end-image-to-video-wan-22
  note: >
    This workflow file contains two parallel pipelines (bypassed via node
    "mode"): a full-quality one (used by video.keyframe-video) and this
    4-step Lightning LoRA one. Verified via workflow_to_api that flipping
    the bypass modes correctly excludes the quality-pipeline nodes and
    produces a valid prompt using only the fast-pipeline nodes.
entrypoints:
  ui: workflow.json
inputs:
- id: 6.text
  label: Prompt
  type: textarea
  required: false
  default: Smooth cinematic motion, coherent transformation, continuous camera movement.
  legacy_kind: textarea
  node_id: '6'
  node_type: CLIPTextEncode
  input: text
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 7.text
  label: Negative prompt
  type: textarea
  required: false
  default: oversaturated colors, overexposed, static image, blurry details, subtitles,
    text, watermark, painterly style, low contrast, gray cast, worst quality, low
    quality, JPEG artifacts, ugly, incomplete, deformed, disfigured, frozen motion
  legacy_kind: textarea
  node_id: '7'
  node_type: CLIPTextEncode
  input: text
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 68.image
  label: Start image
  type: file
  required: false
  default: video_wan2_2_14B_flf2v_start_image.png
  legacy_kind: file
  node_id: '68'
  node_type: LoadImage
  input: image
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 62.image
  label: End image
  type: file
  required: false
  default: video_wan2_2_14B_flf2v_end_image.png
  legacy_kind: file
  node_id: '62'
  node_type: LoadImage
  input: image
  accept: image/png,image/jpeg,image/webp,image/bmp
outputs:
- id: video
  type: video
  description: Generated video output
models:
  required:
  - node_id: '38'
    node_type: CLIPLoader
    name: umt5_xxl_fp8_e4m3fn_scaled.safetensors
    directory: text_encoders
    url: https://huggingface.co/Comfy-Org/Wan_2.1_ComfyUI_repackaged/resolve/main/split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors
  - node_id: '37'
    node_type: UNETLoader
    name: wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors
    directory: diffusion_models
    url: https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/diffusion_models/wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors
  - node_id: '56'
    node_type: UNETLoader
    name: wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors
    directory: diffusion_models
    url: https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/diffusion_models/wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors
  - node_id: '91'
    node_type: LoraLoaderModelOnly
    name: wan2.2_i2v_lightx2v_4steps_lora_v1_high_noise.safetensors
    directory: loras
    url: https://huggingface.co/lightx2v/Wan2.2-Lightning/resolve/main/wan2.2_i2v_lightx2v_4steps_lora_v1_high_noise.safetensors
  - node_id: '92'
    node_type: LoraLoaderModelOnly
    name: wan2.2_i2v_lightx2v_4steps_lora_v1_low_noise.safetensors
    directory: loras
    url: https://huggingface.co/lightx2v/Wan2.2-Lightning/resolve/main/wan2.2_i2v_lightx2v_4steps_lora_v1_low_noise.safetensors
  optional: []
custom_nodes:
  required:
  - comfyui
  optional: []
hardware:
  minimum_vram_gb: 24
  recommended_vram_gb: 32
  supports_low_vram: false
  supports_cpu_offload: false
