id: studio.hunyuan-video-text-to-video
name: Hunyuan video text to video
version: 2.0.0
category: video-gen
description: Migrated video workflow from hunyuan-video-text-to-video.json
status: experimental
media_type: video
source:
  suite: v1
  path: /home/hilbert/ai-suite/legacy-workflows/hunyuan-video-text-to-video.json
entrypoints:
  ui: workflow.json
inputs:
- id: 44.text
  label: Prompt
  type: textarea
  required: false
  default: anime style anime girl with massive fennec ears and one big fluffy tail,
    she has blonde hair long hair blue eyes wearing a pink sweater and a long blue
    skirt walking in a beautiful outdoor scenery with snow mountains in the background
  legacy_kind: textarea
  node_id: '44'
  node_type: CLIPTextEncode
  input: text
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 45.width
  label: Width
  type: int
  required: false
  default: 848
  legacy_kind: number
  node_id: '45'
  node_type: EmptyHunyuanLatentVideo
  input: width
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 45.height
  label: Height
  type: int
  required: false
  default: 480
  legacy_kind: number
  node_id: '45'
  node_type: EmptyHunyuanLatentVideo
  input: height
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 17.steps
  label: Steps
  type: int
  required: false
  default: 20
  legacy_kind: number
  node_id: '17'
  node_type: BasicScheduler
  input: steps
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 45.length
  label: Frames
  type: int
  required: false
  default: 73
  legacy_kind: number
  node_id: '45'
  node_type: EmptyHunyuanLatentVideo
  input: length
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 79.fps
  label: FPS
  type: int
  required: false
  default: 24
  legacy_kind: number
  node_id: '79'
  node_type: CreateVideo
  input: fps
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 45.batch_size
  label: Batch
  type: int
  required: false
  default: 1
  legacy_kind: number
  node_id: '45'
  node_type: EmptyHunyuanLatentVideo
  input: batch_size
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: seed
  label: Seed
  type: int
  required: false
  default: 1
  legacy_kind: number
  node_id: '25'
  node_type: RandomNoise
  input: noise_seed
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 80.filename_prefix
  label: Output folder/prefix
  type: text
  required: false
  default: video/ComfyUI
  legacy_kind: text
  node_id: '80'
  node_type: SaveVideo
  input: filename_prefix
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 11.clip_name1
  label: DualCLIPLoader clip_name1
  type: text
  required: false
  default: clip_l.safetensors
  legacy_kind: text
  node_id: '11'
  node_type: DualCLIPLoader
  input: clip_name1
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 11.clip_name2
  label: DualCLIPLoader clip_name2
  type: text
  required: false
  default: llava_llama3_fp8_scaled.safetensors
  legacy_kind: text
  node_id: '11'
  node_type: DualCLIPLoader
  input: clip_name2
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 17.denoise
  label: Denoise
  type: int
  required: false
  default: 1
  legacy_kind: number
  node_id: '17'
  node_type: BasicScheduler
  input: denoise
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 67.shift
  label: ModelSamplingSD3 shift
  type: int
  required: false
  default: 7
  legacy_kind: number
  node_id: '67'
  node_type: ModelSamplingSD3
  input: shift
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 26.guidance
  label: FluxGuidance guidance
  type: int
  required: false
  default: 6
  legacy_kind: number
  node_id: '26'
  node_type: FluxGuidance
  input: guidance
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 73.tile_size
  label: VAEDecodeTiled tile_size
  type: int
  required: false
  default: 256
  legacy_kind: number
  node_id: '73'
  node_type: VAEDecodeTiled
  input: tile_size
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 73.overlap
  label: VAEDecodeTiled overlap
  type: int
  required: false
  default: 64
  legacy_kind: number
  node_id: '73'
  node_type: VAEDecodeTiled
  input: overlap
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 73.temporal_size
  label: VAEDecodeTiled temporal_size
  type: int
  required: false
  default: 64
  legacy_kind: number
  node_id: '73'
  node_type: VAEDecodeTiled
  input: temporal_size
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: 73.temporal_overlap
  label: VAEDecodeTiled temporal_overlap
  type: int
  required: false
  default: 8
  legacy_kind: number
  node_id: '73'
  node_type: VAEDecodeTiled
  input: temporal_overlap
  accept: image/png,image/jpeg,image/webp,image/bmp
outputs:
- id: video
  type: video
  description: Generated video output
models:
  required:
  - node_id: '11'
    node_type: DualCLIPLoader
    name: clip_l.safetensors
    directory: text_encoders
    url: https://huggingface.co/comfyanonymous/flux_text_encoders/resolve/main/clip_l.safetensors?download=true
  - node_id: '11'
    node_type: DualCLIPLoader
    name: llava_llama3_fp8_scaled.safetensors
    directory: text_encoders
    url: https://huggingface.co/Comfy-Org/HunyuanVideo_repackaged/resolve/main/split_files/text_encoders/llava_llama3_fp8_scaled.safetensors?download=true
  - node_id: '12'
    node_type: UNETLoader
    name: hunyuan_video_t2v_720p_bf16.safetensors
    directory: diffusion_models
    url: https://huggingface.co/Comfy-Org/HunyuanVideo_repackaged/resolve/main/split_files/diffusion_models/hunyuan_video_t2v_720p_bf16.safetensors?download=true
  - node_id: '10'
    node_type: VAELoader
    name: hunyuan_video_vae_bf16.safetensors
    directory: vae
    url: https://huggingface.co/Comfy-Org/HunyuanVideo_repackaged/resolve/main/split_files/vae/hunyuan_video_vae_bf16.safetensors?download=true
  optional: []
custom_nodes:
  required:
  - comfyui
  optional: []
hardware:
  minimum_vram_gb: 8
  recommended_vram_gb: 16
  supports_low_vram: true
  supports_cpu_offload: false
