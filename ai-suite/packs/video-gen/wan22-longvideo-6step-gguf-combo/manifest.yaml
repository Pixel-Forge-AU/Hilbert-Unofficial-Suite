id: video.wan22-longvideo-6step-gguf-combo
name: Wan 2.2 Long-Video 6-Step GGUF Combo (SVI, 4-Clip Chain)
version: 1.0.0
category: video-gen
subcategory: wan22
description: >
  Imported from a user-authored ComfyUI export (wan22I2vWorkflowForLONGVideos_v30.zip /
  i2v_WAN22_6step_3Samplers_GGUF_Combo_SVI_v2.json), preserved as-is: a "Stable Video Infinity" (SVI)
  long-video technique built on Wan 2.2 14B I2V, where up to 4 clips are generated in sequence, each one
  starting from the last frame of the previous clip (via ImageFromBatch + VAEEncode), then optionally
  upscaled (RealESRGAN-family model + downscale-by), interpolated (RIFE) up to a target frame rate, and
  finally concatenated (VHS_VideoCombine) into progressively longer combined videos. Each clip runs a
  2- or 3-KSamplerAdvanced chain (toggled by a "Use 2 Samplers?" boolean and an rgthree Fast Groups
  Bypasser on the "Step 2" group) whose total step count is split across samplers by SimpleMath+ nodes,
  and the whole thing can switch between regular .safetensors UNETLoaders and quantized UnetLoaderGGUF/
  CLIPLoaderGGUF nodes via a "Use GGUF Models?" boolean plus LazySwitchKJ routing - hence "6-step GGUF
  Combo" in the source filename. The non-GGUF fallback UNETLoaders pointed at a community "Dasiwa"
  merge (DasiwaWAN22I2V14BV8V1_midnightflirtHigh/LowV7.safetensors) that isn't installed here, but the
  workflow's own embedded "Models to download!" note says explicitly "choose your favourite, this is
  what I've been using" and lists wan2.2_i2v_high/low_noise_14B_fp8_scaled.safetensors as the documented
  base models - so these were repointed to this suite's installed copies of exactly those files rather
  than left missing. The installed CLIPLoader/VAELoader targets (umt5_xxl_fp8_e4m3fn_scaled.safetensors,
  wan_2.1_vae.safetensors) already matched the source graph exactly - no changes needed there either.
  Several models genuinely have no local equivalent and are left pointing at their original filenames
  with download urls (mostly lifted directly from the workflow's own embedded documentation note, which
  is unusually thorough): the two GGUF UNETs (DasiwaWAN22I2V14BTastysinV8_q8High/Low.gguf, a Civitai
  community GGUF quantization of the same Dasiwa merge - noted here, but a generic non-community
  alternative also exists at QuantStack/Wan2.2-I2V-A14B-GGUF on HuggingFace if the Civitai model is ever
  taken down), the GGUF CLIP loader's umt5-xxl-encoder-Q8_0.gguf (city96/umt5-xxl-encoder-gguf), the two
  "SVI_v2_PRO_Wan2.2-I2V-A14B_HIGH/LOW_lora_rank_128_fp16.safetensors" LoRAs that this long-video
  technique is actually named after and depends on for its per-clip continuity (Kijai/WanVideo_comfy,
  under LoRAs/Stable-Video-Infinity/v2.0/) - these are required for the SVI behavior itself, not
  optional - the "remacri_original.pth" upscale model used in the (bypassable) upscale stage of each
  clip, and the "rife49.pth" RIFE checkpoint used in the (also bypassable) interpolation stage. The
  lightning LoRA used in the optional "Step 2" pass of each clip
  (wan2.2_i2v_lightx2v_4steps_lora_v1_high_noise.safetensors) was already installed under that exact
  name - no change needed, though it ships disabled (on: false) in the source graph by default. Beyond
  core ComfyUI, this graph needs ComfyUI-GGUF (UnetLoaderGGUF/CLIPLoaderGGUF), ComfyUI-KJNodes
  (LazySwitchKJ, INTConstant/BOOLConstant, ImageResizeKJv2, ImageBatchMulti, ImageBatchExtendWithOverlap,
  WanImageToVideoSVIPro), rgthree-comfy (Power Lora Loader, Reroute, Bookmark, Fast Groups Bypasser),
  ComfyUI_essentials (SimpleMath+, BatchCount+), cg-use-everywhere (Anything Everywhere - used pervasively
  instead of direct links to broadcast the loaders/prompts/settings to all 4 clip groups),
  ComfyUI-Frame-Interpolation (RIFE VFI), ComfyUI-Image-Saver (Width/Height Literal), and
  ComfyUI-VideoHelperSuite (VHS_VideoCombine) - none of the first six were installed in this suite, so
  they were cloned from their well-known upstream GitHub repos, matching the approach used for the other
  imported packs in this batch.
status: experimental
media_type: video
entrypoints:
  ui: workflow.json
inputs:
  - id: 22.image
    label: Starting image
    type: image
    required: false
    default: ''
    node_id: '22'
    node_type: LoadImage
    input: image
    accept: image/png,image/jpeg,image/webp,image/bmp
  - id: 1.text
    label: 'Prompt: Clip 1'
    type: textarea
    required: false
    default: A pretty girl with blonde hair is sitting in a busy cafe. She turns away and stares into the distance, she has a thoughtful expression.
    node_id: '1'
    node_type: CLIPTextEncode
    input: text
  - id: 244.text
    label: 'Prompt: Clip 2'
    type: textarea
    required: false
    default: She turns to look down at the coffee cup, then gently picks it up with both hands.
    node_id: '244'
    node_type: CLIPTextEncode
    input: text
  - id: 295.text
    label: 'Prompt: Clip 3'
    type: textarea
    required: false
    default: She closes her eyes and gently sips the coffee.
    node_id: '295'
    node_type: CLIPTextEncode
    input: text
  - id: 345.text
    label: 'Prompt: Clip 4'
    type: textarea
    required: false
    default: She puts the coffee on the table and smiles at the camera.
    node_id: '345'
    node_type: CLIPTextEncode
    input: text
  - id: 19.text
    label: Negative prompt
    type: textarea
    required: false
    default: Overexposure, static, blurred details, subtitles, paintings, pictures, still, overall gray, worst quality, low quality, JPEG compression residue, ugly, mutilated, redundant fingers, poorly painted hands, poorly painted faces, deformed, disfigured, deformed limbs, fused fingers, cluttered background, three legs, a lot of people in the background, upside down, slow mo, slow movement, slow motion, slow
    node_id: '19'
    node_type: CLIPTextEncode
    input: text
  - id: 89.size
    label: Video width
    type: int
    required: false
    default: 480
    minimum: 64
    maximum: 1920
    node_id: '89'
    node_type: Width/Height Literal (Image Saver)
    input: size
  - id: 88.size
    label: Video height
    type: int
    required: false
    default: 688
    minimum: 64
    maximum: 1920
    node_id: '88'
    node_type: Width/Height Literal (Image Saver)
    input: size
  - id: 93.value
    label: Latent video length (frames per clip)
    type: int
    required: false
    default: 81
    minimum: 9
    maximum: 200
    node_id: '93'
    node_type: INTConstant
    input: value
  - id: 101.value
    label: Total steps (must divide evenly by sampler count)
    type: int
    required: false
    default: 6
    minimum: 1
    maximum: 50
    node_id: '101'
    node_type: INTConstant
    input: value
  - id: 92.value
    label: Interpolation multiplier
    type: int
    required: false
    default: 4
    minimum: 1
    maximum: 8
    node_id: '92'
    node_type: INTConstant
    input: value
  - id: 99.value
    label: Final video frame rate
    type: float
    required: false
    default: 60
    minimum: 1
    maximum: 120
    node_id: '99'
    node_type: PrimitiveFloat
    input: value
  - id: 20.value
    label: 'Seed: Clip 1'
    type: int
    required: false
    default: 324537903588012
    node_id: '20'
    node_type: PrimitiveInt
    input: value
  - id: 420.value
    label: 'Seed: Clip 2'
    type: int
    required: false
    default: 324537903588013
    node_id: '420'
    node_type: PrimitiveInt
    input: value
  - id: 422.value
    label: 'Seed: Clip 3'
    type: int
    required: false
    default: 324537903588014
    node_id: '422'
    node_type: PrimitiveInt
    input: value
  - id: 424.value
    label: 'Seed: Clip 4'
    type: int
    required: false
    default: 324537903588015
    node_id: '424'
    node_type: PrimitiveInt
    input: value
  - id: 79.value
    label: Use GGUF models?
    type: bool
    required: false
    default: true
    node_id: '79'
    node_type: BOOLConstant
    input: value
  - id: 103.value
    label: Use 2 samplers (instead of 3)?
    type: bool
    required: false
    default: true
    node_id: '103'
    node_type: BOOLConstant
    input: value
outputs:
  - id: video
    type: video
    description: Generated video output (per clip, plus progressively concatenated combined clips)
models:
  required:
  - node_id: '13'
    node_type: UNETLoader
    name: wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors
    directory: diffusion_models
  - node_id: '14'
    node_type: UNETLoader
    name: wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors
    directory: diffusion_models
  - node_id: '16'
    node_type: CLIPLoader
    name: umt5_xxl_fp8_e4m3fn_scaled.safetensors
    directory: text_encoders
  - node_id: '17'
    node_type: VAELoader
    name: wan_2.1_vae.safetensors
    directory: vae
  - node_id: '24'
    node_type: Power Lora Loader (rgthree)
    name: SVI_v2_PRO_Wan2.2-I2V-A14B_HIGH_lora_rank_128_fp16.safetensors
    directory: loras
    url: https://huggingface.co/Kijai/WanVideo_comfy/resolve/main/LoRAs/Stable-Video-Infinity/v2.0/SVI_v2_PRO_Wan2.2-I2V-A14B_HIGH_lora_rank_128_fp16.safetensors
  - node_id: '26'
    node_type: Power Lora Loader (rgthree)
    name: SVI_v2_PRO_Wan2.2-I2V-A14B_LOW_lora_rank_128_fp16.safetensors
    directory: loras
    url: https://huggingface.co/Kijai/WanVideo_comfy/resolve/main/LoRAs/Stable-Video-Infinity/v2.0/SVI_v2_PRO_Wan2.2-I2V-A14B_LOW_lora_rank_128_fp16.safetensors
  optional:
  - node_id: '73'
    node_type: UnetLoaderGGUF
    name: DasiwaWAN22I2V14BTastysinV8_q8High.gguf
    directory: diffusion_models
    url: https://civitai.com/models/2190659?modelVersionId=2466604
  - node_id: '74'
    node_type: UnetLoaderGGUF
    name: DasiwaWAN22I2V14BTastysinV8_q8Low.gguf
    directory: diffusion_models
    url: https://civitai.com/models/2190659?modelVersionId=2466822
  - node_id: '405'
    node_type: CLIPLoaderGGUF
    name: umt5-xxl-encoder-Q8_0.gguf
    directory: text_encoders
    url: https://huggingface.co/city96/umt5-xxl-encoder-gguf/resolve/main/umt5-xxl-encoder-Q8_0.gguf
  - node_id: '257'
    node_type: Power Lora Loader (rgthree)
    name: wan2.2_i2v_lightx2v_4steps_lora_v1_high_noise.safetensors
    directory: loras
  - node_id: '356'
    node_type: UpscaleModelLoader
    name: remacri_original.pth
    directory: upscale_models
    url: https://huggingface.co/Kim2091/Remacri/resolve/main/remacri_original.pth
  - node_id: '365'
    node_type: RIFE VFI
    name: rife49.pth
    directory: frame_interpolation
    url: https://huggingface.co/Comfy-Org/frame_interpolation/resolve/main/rife49.pth
custom_nodes:
  required:
  - comfyui
  - comfyui-gguf
  - comfyui-kjnodes
  - rgthree-comfy
  - comfyui_essentials
  - cg-use-everywhere
  - comfyui-frame-interpolation
  - comfyui-image-saver
  - comfyui-videohelpersuite
  optional: []
hardware:
  minimum_vram_gb: 12
  recommended_vram_gb: 24
  supports_low_vram: true
  supports_cpu_offload: true
