# Quick Preset for Multiview

name: Quick
description: Fast view generation for quick prototyping and testing

views:
  arrangement: "4-view"
  width: 512
  height: 512

quality:
  steps: 20
  consistency_strength: 0.5
  enable_upscale: false
  enable_face_restore: false

runtime:
  low_vram: true
  cpu_offload: true
  enable_tiling: true