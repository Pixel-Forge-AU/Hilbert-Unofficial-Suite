# Quick Preset for Image to 3D Mesh

name: Quick
description: Fast mesh generation for quick prototyping and testing

generation:
  mesh_resolution: 512
  smooth_iterations: 1
  texture_quality: 1024
  batch_size: 1

quality:
  enable_upscale: false
  enable_face_restore: false
  enable_sharpen: false

runtime:
  low_vram: true
  cpu_offload: true
  enable_tiling: true
  enable_cpu_offload: true