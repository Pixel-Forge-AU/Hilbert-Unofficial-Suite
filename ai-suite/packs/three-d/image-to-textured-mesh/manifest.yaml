id: three-d.image-to-textured-mesh
name: Image to Textured 3D Model
version: 1.0.0
category: three-d
media_type: model
description: >
  Generate a 3D mesh from a single image and paint it, end to end, using
  Tencent's Hunyuan3D-2 shape and paint pipelines (kijai's
  ComfyUI-Hunyuan3DWrapper). Unlike three-d.texture-mesh, which expects an
  already-generated GLB and produced no visible texture on the raw
  marching-cubes output it was given, this workflow generates the mesh and
  textures it in the same graph: the freshly generated shape is cleaned up
  (floater/degenerate-face removal, face count reduction) before UV-unwrapping
  and multi-view texture painting, which is what the raw output was missing.
  Use this when you want a textured model from an image in one pass; use
  three-d.texture-mesh only if you already have a clean, UV-mapped mesh from
  elsewhere.
status: experimental

entrypoints:
  ui: workflow.json
  api: workflow-api.json

inputs:
  - id: image
    label: Reference image
    type: file
    required: true
    default: example.png
    node_id: "1"
    node_type: LoadImage
    input: image
    accept: image/png,image/jpeg,image/webp,image/bmp
    description: Image used both to generate the mesh's shape and to paint its texture

  - id: shape_steps
    label: Shape steps
    type: int
    required: false
    default: 50
    minimum: 1
    maximum: 100
    node_id: "3"
    node_type: Hy3DGenerateMesh
    input: steps

  - id: shape_guidance_scale
    label: Shape guidance scale
    type: float
    required: false
    default: 5.5
    minimum: 0.0
    maximum: 20.0
    step: 0.1
    node_id: "3"
    node_type: Hy3DGenerateMesh
    input: guidance_scale

  - id: shape_seed
    label: Shape seed
    type: int
    required: false
    default: 123
    minimum: 0
    maximum: 18446744073709551615
    node_id: "3"
    node_type: Hy3DGenerateMesh
    input: seed

  - id: max_facenum
    label: Max face count
    type: int
    required: false
    default: 40000
    minimum: 1000
    maximum: 500000
    node_id: "5"
    node_type: Hy3DPostprocessMesh
    input: max_facenum
    description: Mesh is reduced to at most this many faces before UV-wrapping and texturing

  - id: texture_size
    label: Texture size
    type: int
    required: false
    default: 2048
    minimum: 512
    maximum: 4096
    step: 16
    node_id: "8"
    node_type: Hy3DRenderMultiView
    input: texture_size

  - id: delight_steps
    label: Delight steps
    type: int
    required: false
    default: 50
    minimum: 1
    maximum: 100
    node_id: "10"
    node_type: Hy3DDelightImage
    input: steps
    description: Steps used to strip existing lighting/shadows from the reference image

  - id: paint_steps
    label: Paint steps
    type: int
    required: false
    default: 25
    minimum: 1
    maximum: 100
    node_id: "12"
    node_type: Hy3DSampleMultiView
    input: steps

  - id: paint_seed
    label: Paint seed
    type: int
    required: false
    default: 1024
    minimum: 0
    maximum: 18446744073709551615
    node_id: "12"
    node_type: Hy3DSampleMultiView
    input: seed

  - id: filename_prefix
    label: Output folder/prefix
    type: text
    required: false
    default: 3d/image-to-textured-mesh
    node_id: "17"
    node_type: Hy3DExportMesh
    input: filename_prefix

outputs:
  - id: model
    type: model
    description: Generated, textured GLB mesh

models:
  required:
    - type: diffusion_models
      name: hunyuan3d-dit-v2-0-fp16.safetensors
      source: Kijai/Hunyuan3D-2_safetensors
    - type: diffusers
      name: hunyuan3d-delight-v2-0
      source: tencent/Hunyuan3D-2
    - type: diffusers
      name: hunyuan3d-paint-v2-0
      source: tencent/Hunyuan3D-2
  optional: []

custom_nodes:
  required:
    - comfyui
    - ComfyUI-Hunyuan3DWrapper
  optional: []

hardware:
  minimum_vram_gb: 12
  recommended_vram_gb: 16
  supports_low_vram: false
  supports_cpu_offload: true

tags:
  - 3d
  - texture
  - hunyuan3d
  - glb
  - mesh
  - image-to-3d
  - textured
