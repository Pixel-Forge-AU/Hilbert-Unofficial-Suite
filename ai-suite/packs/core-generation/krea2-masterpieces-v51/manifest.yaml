id: community.krea2-masterpieces-v51
name: Krea2 Masterpieces v51 (Krea2 LoRA)
version: 1.0.0
category: core-generation
subcategory: krea2
description: >
  Standalone preset for the krea2-masterpieces-v51 quality/style LoRA, applied over the Moody Cutie
  Mix Krea2 v2.0 checkpoint.
status: experimental
media_type: image
entrypoints:
  ui: workflow.json
inputs:
  - id: 5.text
    label: Prompt
    type: textarea
    required: false
    default: masterpiece, best quality, highly detailed, photorealistic,
    node_id: '5'
    node_type: CLIPTextEncode
    input: text
  - id: 6.text
    label: Negative prompt
    type: textarea
    required: false
    default: low quality, bad anatomy, extra digits, missing digits, extra limbs, missing limbs, blurry, watermark
    node_id: '6'
    node_type: CLIPTextEncode
    input: text
  - id: 7.width
    label: Width
    type: int
    required: false
    default: 1024
    minimum: 256
    maximum: 2048
    node_id: '7'
    node_type: EmptyLatentImage
    input: width
  - id: 7.height
    label: Height
    type: int
    required: false
    default: 1024
    minimum: 256
    maximum: 2048
    node_id: '7'
    node_type: EmptyLatentImage
    input: height
  - id: 8.seed
    label: Seed
    type: int
    required: false
    default: 42
    node_id: '8'
    node_type: KSampler
    input: seed
  - id: 8.steps
    label: Steps
    type: int
    required: false
    default: 25
    minimum: 1
    maximum: 100
    node_id: '8'
    node_type: KSampler
    input: steps
  - id: 8.cfg
    label: CFG
    type: float
    required: false
    default: 4.0
    minimum: 0
    maximum: 20
    node_id: '8'
    node_type: KSampler
    input: cfg
  - id: 1.unet_name
    label: Checkpoint
    type: model
    required: false
    default: moodyCutieMixKrea2_v20.safetensors
    node_id: '1'
    node_type: UNETLoader
    input: unet_name
  - id: 4.lora_name
    label: LoRA
    type: model
    required: false
    default: krea2-masterpieces-v51.safetensors
    node_id: '4'
    node_type: LoraLoaderModelOnly
    input: lora_name
  - id: 4.strength_model
    label: LoRA strength
    type: float
    required: false
    default: 0.8
    minimum: -2
    maximum: 2
    node_id: '4'
    node_type: LoraLoaderModelOnly
    input: strength_model
  - id: 10.filename_prefix
    label: Output folder/prefix
    type: text
    required: false
    default: krea2-masterpieces-v51
    node_id: '10'
    node_type: SaveImage
    input: filename_prefix
outputs:
  - id: image
    type: image
    description: Generated image output
models:
  required:
  - node_id: '1'
    node_type: UNETLoader
    name: moodyCutieMixKrea2_v20.safetensors
    directory: diffusion_models
  - node_type: CLIPLoader
    name: qwen3vl_4b_fp8_scaled.safetensors
    directory: text_encoders
    url: https://huggingface.co/Comfy-Org/Krea-2/resolve/main/text_encoders/qwen3vl_4b_fp8_scaled.safetensors
  - node_type: VAELoader
    name: qwen_image_vae.safetensors
    directory: vae
  - node_id: '4'
    node_type: LoraLoaderModelOnly
    name: krea2-masterpieces-v51.safetensors
    directory: loras
  optional: []
custom_nodes:
  required:
  - comfyui
  optional: []
hardware:
  minimum_vram_gb: 12
  recommended_vram_gb: 24
  supports_low_vram: true
  supports_cpu_offload: true
