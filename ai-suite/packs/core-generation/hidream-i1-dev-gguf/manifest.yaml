id: core.hidream-i1-dev-gguf
name: HiDream-I1 Dev (GGUF)
version: 1.0.0
category: core-generation
subcategory: hidream
description: >
  Built from the Q8 GGUF-quantized HiDream-I1 Dev diffusion transformer (hiDreamI1Dev_devQ8174GB.gguf),
  following node-for-node the official "HiDream-I1" ComfyUI native template bundled with this install
  (comfyui_workflow_templates_json/templates/hidream_i1_dev.json) - UnetLoaderGGUF in place of that
  template's plain UNETLoader, QuadrupleCLIPLoader, ModelSamplingSD3 (shift 6.0, the documented Dev
  value - Full and Fast use 3.0), EmptySD3LatentImage, KSampler (lcm/normal, 28 steps, cfg 1 per the
  template's own "official sampling settings" note for Dev), VAEDecode, SaveImage. HiDream-I1 shares
  Flux's VAE/latent format (comfy/supported_models.py: latent_format = latent_formats.Flux) - the
  installed ae.safetensors is an exact match, no substitution needed. Of QuadrupleCLIPLoader's 4 text
  encoder slots: t5xxl is covered by the installed t5xxl_fp16.safetensors (a precision/format variant of
  the same T5-XXL model the template's t5xxl_fp8_e4m3fn_scaled.safetensors calls for - same role, safe
  substitute); clip_l is pointed at the installed generic clip_l.safetensors as a best-effort stand-in,
  but this is NOT confirmed identical to the template's clip_l_hidream.safetensors (HiDream reportedly
  uses a long-context-tuned CLIP-L/G pair) so prompt fidelity may suffer; clip_g_hidream.safetensors and
  llama_3.1_8b_instruct_fp8_scaled.safetensors are not installed under any name in this suite - the
  installed llava_llama3_fp8_scaled.safetensors is a vision-tuned LLaVA fork of Llama-3, not the plain
  instruction-tuned text encoder HiDream expects, so it was deliberately NOT substituted in (risk of
  shape/tokenizer mismatch or silently wrong conditioning) - both missing files are flagged below with
  their real download URLs (taken directly from the bundled template's own model-links note, Comfy-Org/
  HiDream-I1_ComfyUI on Hugging Face). Needs the city96/ComfyUI-GGUF custom node for UnetLoaderGGUF
  (already installed in this suite). Marked experimental until the two missing text encoders are in
  place - the graph will load but CLIP encoding will fail without them.
status: experimental
media_type: image
entrypoints:
  ui: workflow.json
inputs:
  - id: 4.text
    label: Prompt
    type: textarea
    required: false
    default: A photograph of an albino woman with white skin and dark hair wearing black in the style of old baroque oil paintings, with soft focus, wearing a pearl necklace, dark background, rosy cheeks
    node_id: '4'
    node_type: CLIPTextEncode
    input: text
  - id: 5.text
    label: Negative prompt
    type: textarea
    required: false
    default: bad ugly jpeg artifacts
    node_id: '5'
    node_type: CLIPTextEncode
    input: text
  - id: 6.width
    label: Width
    type: int
    required: false
    default: 1024
    minimum: 256
    maximum: 2048
    node_id: '6'
    node_type: EmptySD3LatentImage
    input: width
  - id: 6.height
    label: Height
    type: int
    required: false
    default: 1024
    minimum: 256
    maximum: 2048
    node_id: '6'
    node_type: EmptySD3LatentImage
    input: height
  - id: 2.shift
    label: Sampling shift
    type: float
    required: false
    default: 6.0
    minimum: 0
    maximum: 12
    node_id: '2'
    node_type: ModelSamplingSD3
    input: shift
  - id: 8.seed
    label: Seed
    type: int
    required: false
    default: 42
    node_id: '8'
    node_type: KSampler
    input: seed
  - id: 8.steps
    label: Steps
    type: int
    required: false
    default: 28
    minimum: 1
    maximum: 100
    node_id: '8'
    node_type: KSampler
    input: steps
  - id: 8.cfg
    label: CFG
    type: float
    required: false
    default: 1.0
    minimum: 0
    maximum: 20
    node_id: '8'
    node_type: KSampler
    input: cfg
  - id: 10.filename_prefix
    label: Output folder/prefix
    type: text
    required: false
    default: hidream-i1-dev
    node_id: '10'
    node_type: SaveImage
    input: filename_prefix
outputs:
  - id: image
    type: image
    description: Generated image output
models:
  required:
  - node_id: '1'
    node_type: UnetLoaderGGUF
    name: hiDreamI1Dev_devQ8174GB.gguf
    directory: diffusion_models
  - node_id: '3'
    node_type: QuadrupleCLIPLoader
    name: clip_l.safetensors
    directory: text_encoders
  - node_id: '3'
    node_type: QuadrupleCLIPLoader
    name: clip_g_hidream.safetensors
    directory: text_encoders
    url: https://huggingface.co/Comfy-Org/HiDream-I1_ComfyUI/resolve/main/split_files/text_encoders/clip_g_hidream.safetensors
  - node_id: '3'
    node_type: QuadrupleCLIPLoader
    name: t5xxl_fp16.safetensors
    directory: text_encoders
  - node_id: '3'
    node_type: QuadrupleCLIPLoader
    name: llama_3.1_8b_instruct_fp8_scaled.safetensors
    directory: text_encoders
    url: https://huggingface.co/Comfy-Org/HiDream-I1_ComfyUI/resolve/main/split_files/text_encoders/llama_3.1_8b_instruct_fp8_scaled.safetensors
  - node_id: '7'
    node_type: VAELoader
    name: ae.safetensors
    directory: vae
  optional: []
custom_nodes:
  required:
  - comfyui
  - comfyui-gguf
  optional: []
hardware:
  minimum_vram_gb: 16
  recommended_vram_gb: 24
  supports_low_vram: true
  supports_cpu_offload: true
