# Text-to-Image Quality Workflow Manifest

id: core.text-to-image-quality
name: Text to Image Quality
version: "1.0.0"

category: core-generation
subcategory: text-to-image

description: >
  Balanced text-to-image generation with 25 steps for high-quality results.
  Optimized for good quality with reasonable generation time.

status: stable

entrypoints:
  ui: workflow.json
  api: workflow-api.json

inputs:
  - id: prompt
    type: text
    required: true
    description: Positive prompt describing the desired image
    
  - id: negative_prompt
    type: text
    required: false
    default: ""
    description: Negative prompt for undesirable elements
    
  - id: width
    type: int
    required: false
    default: 1024
    minimum: 256
    maximum: 2048
    step: 64
    description: Output image width in pixels
    
  - id: height
    type: int
    required: false
    default: 1024
    minimum: 256
    maximum: 2048
    step: 64
    description: Output image height in pixels
    
  - id: seed
    type: int
    required: false
    default: -1
    minimum: -1
    maximum: 1152921504606846975
    description: Random seed for reproducibility (-1 for random)
    
  - id: cfg
    type: float
    required: false
    default: 7.0
    minimum: 1.0
    maximum: 20.0
    step: 0.5
    description: Classifier-free guidance scale
    
  - id: checkpoint
    type: model
    required: false
    default: "sdxl"
    description: Checkpoint model to use

outputs:
  - id: image
    type: image
    description: Generated image output

models:
  required:
    - role: checkpoint
      family:
        - sdxl
        - flux
        - sd15
        - sd3
    - role: vae
      suggested:
        - ae
        - vae-ft-mse-840000-ema-pruned
    - role: text_encoder
      suggested:
        - t5xxl
        - clip-l
        - clip-g

  optional:
    - role: lora
      suggested: []

custom_nodes:
  required:
    - comfyui

  optional:
    - comfyui-impact-pack
    - comfyui-controlnet-aux

hardware:
  minimum_vram_gb: 8
  recommended_vram_gb: 12
  supports_low_vram: true
  supports_cpu_offload: true

runtime:
  class: medium
  batch_supported: true

content:
  themes:
    - general
    - high-quality
    - balanced
    - professional
  adult_only: false

tags:
  - quality
  - balanced
  - general
  - professional
  - 25-steps
  - sdxl

presets:
  - fast
  - balanced
  - quality