# Core Generation Pack Manifest

id: core-generation
name: Core Generation
version: "2.0.0"

description: >
  Fundamental image generation workflows including text-to-image, image-to-image,
  inpainting, and upscaling capabilities.

workflows:
  - core.image-to-image
  - core.inpainting
  - core.outpainting-square-to-landscape
  - core.outpainting-square-to-portrait
  - core.outpainting-cinematic
  - core.outpainting-wallpaper
  - core.outpainting-panorama
  - core.upscale-simple
  - core.upscale-high-quality
  - core.multi-model-comparison
  - core.hidream-i1-dev-gguf

default_enabled: true