id: community.ghostmix-v20-bakedvae
name: GhostMix v2.0 (Baked VAE)
version: 1.0.0
category: image-stylized
subcategory: sd15
description: Self-contained SD1.5 checkpoint with baked VAE, a well-known anime/realistic hybrid merge.
status: experimental
media_type: image
entrypoints:
  ui: workflow.json
inputs:
- id: 2.text
  label: Prompt
  type: textarea
  required: false
  default: masterpiece, best quality, highly detailed, anime style,
  node_id: '2'
  node_type: CLIPTextEncode
  input: text
- id: 3.text
  label: Negative prompt
  type: textarea
  required: false
  default: low quality, bad anatomy, extra digits, missing digits, extra limbs, missing limbs, blurry, watermark
  node_id: '3'
  node_type: CLIPTextEncode
  input: text
- id: 4.width
  label: Width
  type: int
  required: false
  default: 1024
  minimum: 256
  maximum: 2048
  node_id: '4'
  node_type: EmptyLatentImage
  input: width
- id: 4.height
  label: Height
  type: int
  required: false
  default: 1024
  minimum: 256
  maximum: 2048
  node_id: '4'
  node_type: EmptyLatentImage
  input: height
- id: seed
  label: Seed
  type: int
  required: false
  default: 42
  node_id: '5'
  node_type: KSampler
  input: seed
- id: 5.steps
  label: Steps
  type: int
  required: false
  default: 20
  minimum: 1
  maximum: 100
  node_id: '5'
  node_type: KSampler
  input: steps
- id: 5.cfg
  label: CFG
  type: float
  required: false
  default: 7.0
  minimum: 0
  maximum: 20
  node_id: '5'
  node_type: KSampler
  input: cfg
- id: 1.ckpt_name
  label: Checkpoint
  type: model
  required: false
  default: ghostmix_v20Bakedvae.safetensors
  node_id: '1'
  node_type: CheckpointLoaderSimple
  input: ckpt_name
- id: 7.filename_prefix
  label: Output folder/prefix
  type: text
  required: false
  default: ghostmix-v20-bakedvae
  node_id: '7'
  node_type: SaveImage
  input: filename_prefix
outputs:
- id: image
  type: image
  description: Generated image output
models:
  required:
  - node_id: '1'
    node_type: CheckpointLoaderSimple
    name: ghostmix_v20Bakedvae.safetensors
    directory: checkpoints
  optional: []
custom_nodes:
  required:
  - comfyui
  optional: []
hardware:
  minimum_vram_gb: 8
  recommended_vram_gb: 12
  supports_low_vram: true
  supports_cpu_offload: true
