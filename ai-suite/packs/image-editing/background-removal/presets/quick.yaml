# Quick Preset for Background Removal

name: Quick
description: Fast background removal optimized for speed

generation:
  segmentation_model: fast-sam
  dilation: 0
  blur_edges: 2.0
  batch_size: 1

quality:
  enable_upscale: false
  enable_face_restore: false
  enable_sharpen: false

runtime:
  low_vram: true
  cpu_offload: true
  enable_tiling: false
  enable_cpu_offload: true