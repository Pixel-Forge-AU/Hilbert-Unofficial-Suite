# Quick Preset for Background Replacement

name: Quick
description: Fast background replacement with default settings

generation:
  segmentation_model: fast-sam
  blend_strength: 0.8
  match_lighting: true
  batch_size: 1

quality:
  enable_upscale: false
  enable_face_restore: false
  enable_sharpen: false

runtime:
  low_vram: true
  cpu_offload: true
  enable_tiling: false
  enable_cpu_offload: true