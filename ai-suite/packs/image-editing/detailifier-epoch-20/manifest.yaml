id: community.detailifier-epoch-20
name: Detailifier (Krea2 LoRA)
version: 1.1.0
category: image-editing
subcategory: krea2
description: >
  Img2img preset for the detailifier_epoch_20 detail-enhancer LoRA, applied over the Moody Cutie
  Mix Krea2 v2.0 checkpoint. Takes a source image and redraws it at a low denoise strength to add
  detail while keeping the composition. Lower default strength since detail LoRAs tend to be strong.
status: experimental
media_type: image
entrypoints:
  ui: workflow.json
inputs:
  - id: image
    label: Source image
    type: file
    required: true
    default: example.png
    node_id: '11'
    node_type: LoadImage
    input: image
    accept: image/png,image/jpeg,image/webp,image/bmp
    description: Image to add detail to
  - id: 5.text
    label: Prompt
    type: textarea
    required: false
    default: masterpiece, best quality, highly detailed, photorealistic,
    node_id: '5'
    node_type: CLIPTextEncode
    input: text
  - id: 6.text
    label: Negative prompt
    type: textarea
    required: false
    default: low quality, bad anatomy, extra digits, missing digits, extra limbs, missing limbs, blurry, watermark
    node_id: '6'
    node_type: CLIPTextEncode
    input: text
  - id: 8.denoise
    label: Detail strength
    type: float
    required: false
    default: 0.35
    minimum: 0.05
    maximum: 1.0
    step: 0.01
    node_id: '8'
    node_type: KSampler
    input: denoise
    description: How strongly to redraw the source image. Lower preserves more of the original.
  - id: 7.width
    label: Resize width
    type: int
    required: false
    default: 1024
    minimum: 256
    maximum: 2048
    node_id: '7'
    node_type: ImageScale
    input: width
  - id: 7.height
    label: Resize height
    type: int
    required: false
    default: 1024
    minimum: 256
    maximum: 2048
    node_id: '7'
    node_type: ImageScale
    input: height
  - id: seed
    label: Seed
    type: int
    required: false
    default: 42
    node_id: '8'
    node_type: KSampler
    input: seed
  - id: 8.steps
    label: Steps
    type: int
    required: false
    default: 25
    minimum: 1
    maximum: 100
    node_id: '8'
    node_type: KSampler
    input: steps
  - id: 8.cfg
    label: CFG
    type: float
    required: false
    default: 4.0
    minimum: 0
    maximum: 20
    node_id: '8'
    node_type: KSampler
    input: cfg
  - id: 1.unet_name
    label: Checkpoint
    type: model
    required: false
    default: moodyCutieMixKrea2_v20.safetensors
    node_id: '1'
    node_type: UNETLoader
    input: unet_name
  - id: 4.lora_name
    label: LoRA
    type: model
    required: false
    default: detailifier_epoch_20.safetensors
    node_id: '4'
    node_type: LoraLoaderModelOnly
    input: lora_name
  - id: 4.strength_model
    label: LoRA strength
    type: float
    required: false
    default: 0.6
    minimum: -2
    maximum: 2
    node_id: '4'
    node_type: LoraLoaderModelOnly
    input: strength_model
  - id: 10.filename_prefix
    label: Output folder/prefix
    type: text
    required: false
    default: detailifier-epoch-20
    node_id: '10'
    node_type: SaveImage
    input: filename_prefix
outputs:
  - id: image
    type: image
    description: Generated image output
models:
  required:
  - node_id: '1'
    node_type: UNETLoader
    name: moodyCutieMixKrea2_v20.safetensors
    directory: diffusion_models
  - node_type: CLIPLoader
    name: qwen3vl_4b_fp8_scaled.safetensors
    directory: text_encoders
    url: https://huggingface.co/Comfy-Org/Krea-2/resolve/main/text_encoders/qwen3vl_4b_fp8_scaled.safetensors
  - node_type: VAELoader
    name: qwen_image_vae.safetensors
    directory: vae
  - node_id: '4'
    node_type: LoraLoaderModelOnly
    name: detailifier_epoch_20.safetensors
    directory: loras
  optional: []
custom_nodes:
  required:
  - comfyui
  optional: []
hardware:
  minimum_vram_gb: 12
  recommended_vram_gb: 24
  supports_low_vram: true
  supports_cpu_offload: true
