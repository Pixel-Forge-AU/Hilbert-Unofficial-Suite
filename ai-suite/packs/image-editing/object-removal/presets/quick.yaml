# Quick Preset for Object Removal

name: Quick
description: Fast object removal with standard settings

generation:
  segmentation_model: fast-sam
  inpainting_strength: 0.7
  context_preservation: 0.8
  batch_size: 1

quality:
  enable_upscale: false
  enable_face_restore: false
  enable_sharpen: false

runtime:
  low_vram: true
  cpu_offload: true
  enable_tiling: false
  enable_cpu_offload: true