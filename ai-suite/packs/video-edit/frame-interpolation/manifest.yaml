id: video.frame-interpolation
name: Frame Interpolation
version: 2.0.0
category: video-edit
description: Add intermediate frames to an input video using the migrated FILM interpolation
  workflow.
status: stable
media_type: video
source:
  suite: v1
  path: packs/studio-migrated/frame-interpolation/workflow.json
  promoted_from: studio.frame-interpolation
entrypoints:
  ui: workflow.json
inputs:
- id: video
  label: Input video
  type: file
  required: true
  default: white_armored_warrior.mp4
  legacy_kind: file
  node_id: '4'
  node_type: LoadVideo
  input: video
  accept: video/mp4,video/webm,video/quicktime,video/x-matroska
  description: Input video to interpolate
- id: multiplier
  label: Frame multiplier
  type: int
  required: false
  default: 2
  legacy_kind: number
  node_id: 16_sg_2
  node_type: FrameInterpolate
  input: multiplier
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: fps
  label: Output FPS
  type: int
  required: false
  default: 30
  legacy_kind: number
  node_id: 16_sg_5
  node_type: CreateVideo
  input: fps
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: model_name
  label: Interpolation model
  type: text
  required: false
  default: film_net_fp16.safetensors
  legacy_kind: text
  node_id: 16_sg_1
  node_type: FrameInterpolationModelLoader
  input: model_name
  accept: image/png,image/jpeg,image/webp,image/bmp
outputs:
- id: video
  type: video
  description: Interpolated video clip
models:
  required:
  - node_id: 16_sg_1
    node_type: FrameInterpolationModelLoader
    name: film_net_fp16.safetensors
    directory: frame_interpolation
    url: https://huggingface.co/Comfy-Org/frame_interpolation/resolve/main/frame_interpolation/film_net_fp16.safetensors
  optional: []
custom_nodes:
  required:
  - comfyui
  optional: []
hardware:
  minimum_vram_gb: 8
  recommended_vram_gb: 16
  supports_low_vram: true
  supports_cpu_offload: false
tags:
- film
- frame-interpolation
- video
