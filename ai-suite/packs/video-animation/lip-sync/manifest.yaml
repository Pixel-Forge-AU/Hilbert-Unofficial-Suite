id: video.lip-sync
name: Lip Sync Animation
version: 2.1.0
category: video-animation
media_type: video
description: >
  Experimental single-speaker lip-sync generation using ComfyUI's native
  WanInfiniteTalkToVideo node. Upload an image and speech audio to generate a
  Wan2.1 InfiniteTalk clip with synchronized mouth motion and embedded audio.
  The graph validates locally, but full Wan 14B runtime can be very slow on this
  machine and should be treated as experimental until a completed MP4 is observed.
status: experimental

entrypoints:
  ui: workflow.json
  api: workflow-api.json

inputs:
  - id: image
    label: Source image
    type: file
    required: true
    default: example.png
    node_id: "8"
    node_type: LoadImage
    input: image
    accept: image/png,image/jpeg,image/webp,image/bmp
    description: Source face or character image to lip-sync

  - id: audio
    label: Speech audio
    type: file
    required: true
    default: example.wav
    node_id: "9"
    node_type: LoadAudio
    input: audio
    accept: audio/wav,audio/mpeg,audio/mp3,audio/flac,audio/ogg
    description: Speech track used for lip synchronization

  - id: prompt
    label: Motion prompt
    type: textarea
    required: false
    default: The person speaks naturally in sync with the supplied audio, with stable identity, clear mouth movement, and minimal background drift.
    node_id: "5"
    node_type: CLIPTextEncode
    input: text

  - id: width
    label: Width
    type: int
    required: false
    default: 832
    minimum: 256
    maximum: 1280
    step: 16
    node_id: "13"
    node_type: WanInfiniteTalkToVideo
    input: width

  - id: height
    label: Height
    type: int
    required: false
    default: 480
    minimum: 256
    maximum: 1280
    step: 16
    node_id: "13"
    node_type: WanInfiniteTalkToVideo
    input: height

  - id: frames
    label: Frames
    type: int
    required: false
    default: 17
    minimum: 5
    maximum: 241
    step: 4
    node_id: "13"
    node_type: WanInfiniteTalkToVideo
    input: length
    description: Output frame count; the launcher normalizes this to 4n+1 for Wan

  - id: fps
    label: FPS
    type: float
    required: false
    default: 16.0
    minimum: 1.0
    maximum: 60.0
    step: 1.0
    node_id: "20"
    node_type: CreateVideo
    input: fps

  - id: steps
    label: Steps
    type: int
    required: false
    default: 4
    minimum: 1
    maximum: 40
    step: 1
    node_id: "17"
    node_type: BasicScheduler
    input: steps

  - id: cfg
    label: CFG
    type: float
    required: false
    default: 1.0
    minimum: 0.1
    maximum: 8.0
    step: 0.1
    node_id: "15"
    node_type: CFGGuider
    input: cfg

  - id: sampler_name
    label: Sampler
    type: select
    required: false
    default: euler
    options:
      - euler
      - dpmpp_2m
      - uni_pc
    node_id: "16"
    node_type: KSamplerSelect
    input: sampler_name

  - id: scheduler
    label: Scheduler
    type: select
    required: false
    default: normal
    options:
      - normal
      - simple
      - karras
      - beta
    node_id: "17"
    node_type: BasicScheduler
    input: scheduler

  - id: seed
    label: Seed
    type: int
    required: false
    default: -1
    minimum: -1
    maximum: 1152921504606846975
    node_id: "14"
    node_type: RandomNoise
    input: noise_seed

  - id: audio_scale
    label: Audio scale
    type: float
    required: false
    default: 1.0
    minimum: 0.1
    maximum: 3.0
    step: 0.05
    node_id: "13"
    node_type: WanInfiniteTalkToVideo
    input: audio_scale

  - id: motion_frame_count
    label: Motion context
    type: int
    required: false
    default: 9
    minimum: 1
    maximum: 33
    step: 1
    node_id: "13"
    node_type: WanInfiniteTalkToVideo
    input: motion_frame_count

  - id: lora_strength
    label: LightX2V strength
    type: float
    required: false
    default: 1.0
    minimum: 0.0
    maximum: 1.5
    step: 0.05
    node_id: "2"
    node_type: LoraLoaderModelOnly
    input: strength_model

  - id: filename_prefix
    label: Output folder/prefix
    type: text
    required: false
    default: video/infinitetalk-lip-sync
    node_id: "21"
    node_type: SaveVideo
    input: filename_prefix

outputs:
  - id: video
    type: video
    description: Wan2.1 InfiniteTalk lip-synced video with embedded audio

models:
  required:
    - type: diffusion_models
      name: wan2.1_i2v_480p_14B_fp8_scaled.safetensors
      source: Comfy-Org/Wan_2.1_ComfyUI_repackaged
    - type: loras
      name: lightx2v_I2V_14B_480p_cfg_step_distill_rank64_bf16.safetensors
      source: Kijai/WanVideo_comfy
    - type: text_encoders
      name: umt5_xxl_fp8_e4m3fn_scaled.safetensors
    - type: vae
      name: Wan2_1_VAE_bf16.safetensors
    - type: audio_encoders
      name: wav2vec2-chinese-base_fp16.safetensors
      source: Kijai/wav2vec2_safetensors
    - type: model_patches
      name: infinitetalk_single.safetensors
      source: MeiGen-AI/InfiniteTalk
  optional: []

custom_nodes:
  required:
    - comfyui
  optional: []

hardware:
  minimum_vram_gb: 16
  recommended_vram_gb: 24
  supports_low_vram: false
  supports_cpu_offload: false

tags:
  - infinitetalk
  - lip-sync
  - audio-to-video
  - wan2.1
  - video
  - make image speak
  - talking photo
  - talking avatar
  - photo to speaking video
  - sync mouth to audio
