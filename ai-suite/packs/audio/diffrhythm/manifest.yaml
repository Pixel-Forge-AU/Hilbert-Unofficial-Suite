# DiffRhythm Workflow Manifest

id: audio.diffrhythm
name: DiffRhythm Audio Generation
version: "2.0.0"
category: audio
description: >
  Generate music from text prompts using DiffRhythm model.
  Creates full musical tracks with rhythm and melody.

status: stable
media_type: audio

entrypoints:
  ui: workflow.json

inputs:
  - id: style_prompt
    label: Style prompt
    type: textarea
    required: true
    default: "A warm synthwave track with pulsing bass and dreamy pads"
    legacy_kind: textarea
    node_id: "2"
    node_type: DiffRhythmRun
    input: style_prompt
    description: Text description of the musical style to generate

  - id: model
    label: Model
    type: text
    required: true
    default: "cfm_model_v1_2.pt"
    legacy_kind: text
    node_id: "2"
    node_type: DiffRhythmRun
    input: model
    description: "DiffRhythm checkpoint to use (cfm_model_v1_2.pt, cfm_model.pt, cfm_full_model.pt)"

  - id: steps
    label: Steps
    type: int
    required: false
    default: 30
    legacy_kind: number
    node_id: "2"
    node_type: DiffRhythmRun
    input: steps
    description: Number of sampling steps

  - id: cfg
    label: CFG
    type: int
    required: false
    default: 4
    legacy_kind: number
    node_id: "2"
    node_type: DiffRhythmRun
    input: cfg
    description: Classifier-free guidance scale (1-10)

  - id: quality_or_speed
    label: Quality or speed
    type: text
    required: false
    default: "speed"
    legacy_kind: text
    node_id: "2"
    node_type: DiffRhythmRun
    input: quality_or_speed
    description: "Trade-off preset: quality or speed"

  - id: odeint_method
    label: ODE solver
    type: text
    required: false
    default: "euler"
    legacy_kind: text
    node_id: "2"
    node_type: DiffRhythmRun
    input: odeint_method
    description: "ODE integration method: euler, midpoint, rk4, implicit_adams"

  - id: seed
    label: Seed
    type: int
    required: false
    default: 0
    legacy_kind: number
    node_id: "2"
    node_type: DiffRhythmRun
    input: seed
    description: Random seed for reproducibility (0 = random)

  - id: unload_model
    label: Unload model after run
    type: boolean
    required: false
    default: true
    legacy_kind: boolean
    node_id: "2"
    node_type: DiffRhythmRun
    input: unload_model
    description: Free VRAM by unloading the model after generation

outputs:
  - id: audio
    type: audio
    description: Generated audio output

models:
  required: []
  optional: []

custom_nodes:
  required:
    - comfyui
  optional:
    - comfyui-diffrhythm

hardware:
  minimum_vram_gb: 8
  recommended_vram_gb: 16
  supports_low_vram: true
  supports_cpu_offload: false

tags:
  - audio
  - music
  - diffrhythm
  - text-to-audio
  - synthwave

presets:
  - balanced
  - high-quality