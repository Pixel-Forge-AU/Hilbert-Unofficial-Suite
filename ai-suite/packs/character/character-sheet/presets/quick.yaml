# Quick Preset for Character Character Sheet

name: Quick
description: Fast character sheet generation for quick reference

generation:
  width: 1536
  height: 768
  steps: 20
  cfg: 6.0
  batch_size: 1

sampling:
  sampler: dpmpp_2m
  scheduler: simple
  denoise: 1.0

quality:
  enable_upscale: false
  enable_face_restore: false
  enable_sharpen: false

runtime:
  low_vram: true
  cpu_offload: true
  enable_tiling: false
  enable_cpu_offload: true