id: llm.image-critic
name: LLM Image Critic
version: 2.0.0
category: llm-orchestration
subcategory: evaluation
description: 'Evaluate and critique generated images using LLM intelligence. Analyzes
  composition, quality, adherence to prompt, and provides constructive feedback for
  improvement. Perfect for iterative refinement and quality assurance.

  Runs locally through the AI Suite llama.cpp service instead of ComfyUI custom nodes.

  '
status: stable
entrypoints:
  service: llama_cpp
inputs:
- id: image
  type: file
  required: true
  description: Image to evaluate and critique
  accept: image/png,image/jpeg,image/webp,image/bmp
- id: original_prompt
  type: text
  required: false
  default: ''
  description: Original prompt used to generate the image
- id: critique_depth
  type: int
  required: false
  default: 2
  minimum: 1
  maximum: 3
  step: 1
  description: Depth of critique (1=quick, 2=detailed, 3=expert analysis)
- id: focus_areas
  type: text
  required: false
  default: all
  description: Specific areas to focus on (composition, lighting, anatomy, etc.)
- id: llm_model
  type: text
  required: false
  default: gpt-4o
  description: LLM model to use for analysis
outputs:
- id: critique
  type: text
  description: Detailed critique of the image
- id: strengths
  type: text
  description: Identified strengths
- id: weaknesses
  type: text
  description: Identified weaknesses and areas for improvement
- id: score
  type: float
  description: Overall quality score (0-10)
models:
  required: []
  optional: []
custom_nodes:
  required: []
  optional: []
hardware:
  minimum_vram_gb: 8
  recommended_vram_gb: 16
  supports_low_vram: true
  supports_cpu_offload: true
runtime:
  class: light
  batch_supported: false
  type: llm_service
  service: llama_cpp
  endpoint: http://127.0.0.1:39001/v1/chat/completions
content:
  themes:
  - llm
  - evaluation
  - critique
  - quality-assurance
  adult_only: false
tags:
- analysis
- critique
- evaluation
- feedback
- image-critic
- llama-cpp
- llm
- local-llm
- quality
- service-workflow
presets:
- quick
- detailed
- expert
media_type: text
